                  ctl.addView(toggle("Mostrar controles", s.showControls) { s.showControls = it })
                  val alphaLabel = Ui.text(act, "Opacidade: ${s.controlsAlpha}%", 15f)
                  ctl.addView(alphaLabel)
                  ctl.addView(seek(80, s.controlsAlpha - 20) { v ->
                      s.controlsAlpha = v + 20
                      alphaLabel.text = "Opacidade: ${v + 20}%"
                  })
                  ctl.addView(Ui.text(act, "Os analógicos ficam fixos nos cantos. No PlayStation, use o botão ANALOG da tela para ligar/desligar o modo analógico (segure uns 2 segundos até o jogo trocar).", 12f, Ui.SUB))
