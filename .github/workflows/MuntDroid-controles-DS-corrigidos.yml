          package dev.n64emu.app

          import android.content.Context
          import android.os.Handler
          import android.os.Looper
          import android.widget.Toast
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          /** Uma conquista do muntdroid: libera sozinha quando o contador [counter] chega em [goal]. */
          data class Achievement(
              val id: String, val icon: String, val title: String, val desc: String,
              val counter: String, val goal: Int, val points: Int
          )

