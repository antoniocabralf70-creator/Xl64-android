                  val lp = FrameLayout.LayoutParams(FrameLayout.LayoutParams.WRAP_CONTENT, FrameLayout.LayoutParams.WRAP_CONTENT, Gravity.BOTTOM or Gravity.END)
                  lp.setMargins(dp(16), dp(16), dp(16), dp(16))
                  view.addView(fab, lp)
              }

              /** Busca online a capa de todos os jogos que ainda estão sem capa. */
              /** Ao abrir o app, tenta de novo as capas que faltam (sem avisos). */
              fun autoFetch() {
                  fetchAllCovers(true)
              }

              private fun fetchAllCovers(silent: Boolean = false) {
                  if (coversBusy) return
                  val todo = act.library.games.filter { val c = it.cover; c == null || !java.io.File(c).exists() }
                  if (todo.isEmpty()) {
                      if (!silent) Toast.makeText(act, "Todos os jogos já têm capa.", Toast.LENGTH_SHORT).show()
                      return
                  }
                  coversBusy = true
                  coversBtn.isEnabled = false
                  Thread {
                      var found = 0
                      try {
                          for ((i, g) in todo.withIndex()) {
                              act.runOnUiThread { coversBtn.text = "Buscando " + (i + 1) + "/" + todo.size + "…" }
                              val p = Covers.fetchOnline(act, g)
                              if (p != null) {
                                  g.cover = p
                                  found++
                                  Achievements.add(act, "covers", 1)
                                  act.library.save()
                                  if (found % 4 == 0) act.runOnUiThread { refresh() }
                              }
                          }
                      } catch (e: Throwable) {
                      }
                      act.runOnUiThread {
                          coversBusy = false
                          coversBtn.isEnabled = true
                          coversBtn.text = "🖼 Buscar capas"
                          refresh()
                          if (!silent) Toast.makeText(act, "Capas encontradas: " + found + " de " + todo.size + ". As outras: segure o jogo e escolha da galeria.", Toast.LENGTH_LONG).show()
                      }
                  }.start()
              }

              fun refresh() {
                  grid.removeAllViews()
                  val games = act.library.games
                  empty.visibility = if (games.isEmpty()) View.VISIBLE else View.GONE
                  val screenW = act.resources.displayMetrics.widthPixels
                  val cols = maxOf(2, screenW / dp(160))
                  grid.columnCount = cols
                  val w = (screenW - 2 * dp(12)) / cols - 2 * dp(6)
                  for (g in games) {
                      val lp = GridLayout.LayoutParams()
                      lp.width = w
                      lp.height = GridLayout.LayoutParams.WRAP_CONTENT
                      lp.setMargins(dp(6), dp(6), dp(6), dp(6))
                      grid.addView(card(g, w), lp)
                  }
              }

              private fun card(g: Game, w: Int): View {
                  val box = LinearLayout(act)
                  box.orientation = LinearLayout.VERTICAL
                  box.background = Ui.rounded(Ui.CARD, dp(12))
                  box.clipToOutline = true
                  box.outlineProvider = ViewOutlineProvider.BACKGROUND

