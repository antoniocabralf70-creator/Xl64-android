          package dev.n64emu.app

          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.RectF
          import android.view.View
          import java.io.BufferedInputStream
          import java.io.BufferedOutputStream
          import java.io.ByteArrayOutputStream
          import java.io.DataInputStream
          import java.io.DataOutputStream
          import java.io.File
          import java.io.FileInputStream
          import java.io.InputStream
          import java.net.Inet4Address
          import java.net.InetSocketAddress
          import java.net.NetworkInterface
          import java.net.ServerSocket
          import java.net.Socket
          import java.nio.ByteBuffer
          import java.util.Collections
          import java.util.concurrent.ArrayBlockingQueue
          import java.util.concurrent.TimeUnit
          import java.util.zip.CRC32

          /**
           * Sala local (somente mesma rede Wi-Fi ou roteador portátil, sem internet):
           *  - o celular que cria a sala roda o jogo e é o controle 1;
           *  - os outros entram com o código, veem o vídeo do jogo (MJPEG) e mandam os próprios botões,
           *    que o host recebe como controles 2, 3 e 4.
           * Só entra quem tiver a mesma ROM (CRC32 da ROM normalizada para .z64).
           */
          object RoomProto {
              const val MAGIC = 0x4E363452 // "N64R"
              const val VERSION = 2
              const val PORT = 38641
              const val MAX_PLAYERS = 4 // host + 3 convidados

              const val ST_OK = 0
              const val ST_ROM = 1
              const val ST_FULL = 2
              const val ST_VERSION = 3
          }

          /** Encaminha os toques da tela: no modo convidado vão pela rede, senão direto para o núcleo (controle 1). */
          object Input {
              @Volatile var remote: RoomClient? = null

              fun button(id: Int, pressed: Boolean) {
                  val r = remote
                  if (r != null) r.setButton(id, pressed) else NativeBridge.setButton(id, pressed)
              }

              fun analog(which: Int, x: Float, y: Float) {
                  val r = remote
                  if (r != null) r.setAnalog(which, x, y) else NativeBridge.setAnalog(which, x, y)
              }

              fun pointer(x: Int, y: Int, pressed: Boolean) {
                  NativeBridge.setPointer(x, y, pressed)
              }
          }

          /** O código da sala é o IP local do host em base 36 (7 caracteres). */
          object RoomCode {
              fun encode(ip: String): String? {
                  val p = ip.split(".")
                  if (p.size != 4) return null
                  var v = 0L
                  for (x in p) {
                      val n = x.toIntOrNull() ?: return null
                      if (n < 0 || n > 255) return null
                      v = (v shl 8) or n.toLong()
                  }
                  return v.toString(36).uppercase().padStart(7, '0')
              }

              fun pretty(code: String): String =
                  if (code.length > 4) code.substring(0, 4) + "-" + code.substring(4) else code

              fun decode(text: String): String? {
                  val c = text.filter { it.isLetterOrDigit() }.lowercase()
                  if (c.isEmpty() || c.length > 7) return null
                  val v = c.toLongOrNull(36) ?: return null
                  if (v < 0L || v > 0xFFFFFFFFL) return null
                  return "${(v shr 24) and 255L}.${(v shr 16) and 255L}.${(v shr 8) and 255L}.${v and 255L}"
              }
          }

          object RoomNet {
              /** IPv4 da rede local (Wi-Fi ou roteador portátil). Null se não houver rede. */
              fun localIp(): String? {
                  var best: String? = null
                  var bestScore = -1
                  try {
                      val list = Collections.list(NetworkInterface.getNetworkInterfaces() ?: return null)
                      for (ni in list) {
                          if (!ni.isUp || ni.isLoopback) continue
                          val n = ni.name.lowercase()
                          val score = if (n.startsWith("wlan") || n.startsWith("ap") || n.startsWith("swlan") || n.startsWith("eth")) 2 else 1
                          for (a in Collections.list(ni.inetAddresses)) {
                              if (a is Inet4Address && !a.isLoopbackAddress && a.isSiteLocalAddress && score > bestScore) {
                                  bestScore = score
                                  best = a.hostAddress
                              }
                          }
                      }
                  } catch (e: Exception) {
                  }
                  return best
              }
          }

          /** CRC32 da ROM já normalizada para big-endian (.z64), assim .z64/.v64/.n64 da mesma ROM dão o mesmo valor. */
          object RomHash {
              fun of(file: File): Int = FileInputStream(file).use { of(it) }

              /** PS1: CRC32 dos primeiros 2 MB da imagem (do primeiro .bin quando o jogo é um .cue). */
              fun ofPs1(ctx: Context, main: android.net.Uri, extras: List<android.net.Uri>): Int {
                  val isCue = Ps1Files.fileName(ctx, main).lowercase().endsWith(".cue")
                  val src = if (isCue && extras.isNotEmpty()) extras[0] else main
                  val crc = CRC32()
                  val buf = ByteArray(1 shl 16)
                  var left = 2 * 1024 * 1024
                  ctx.contentResolver.openInputStream(src)?.use { ins ->
                      while (left > 0) {
                          val r = ins.read(buf, 0, minOf(buf.size, left))
                          if (r < 0) break
                          crc.update(buf, 0, r)
                          left -= r
                      }
                  } ?: throw java.io.IOException("não consegui ler o disco")
                  return crc.value.toInt()
              }

              fun of(ins: InputStream): Int {
                  val crc = CRC32()
                  val buf = ByteArray(1 shl 16)
                  var mode = -1
                  while (true) {
                      var n = 0
                      while (n < buf.size) {
                          val r = ins.read(buf, n, buf.size - n)
                          if (r < 0) break
                          n += r
                      }
                      if (n <= 0) break
                      if (mode == -1) {
                          mode = when (buf[0].toInt() and 0xFF) {
                              0x37 -> 1 // .v64 (bytes trocados em pares)
                              0x40 -> 2 // .n64 (palavras invertidas)
                              else -> 0 // .z64
                          }
                      }
                      if (mode == 1) {
                          var i = 0
                          while (i + 1 < n) {
                              val t = buf[i]; buf[i] = buf[i + 1]; buf[i + 1] = t
                              i += 2
                          }
                      } else if (mode == 2) {
                          var i = 0
                          while (i + 3 < n) {
                              val t0 = buf[i]; val t1 = buf[i + 1]
                              buf[i] = buf[i + 3]; buf[i + 1] = buf[i + 2]; buf[i + 2] = t1; buf[i + 3] = t0
                              i += 4
                          }
                      }
                      crc.update(buf, 0, n)
                      if (n < buf.size) break
                  }
                  return crc.value.toInt()
              }
          }

          /** Lado do dono da sala: aceita até 3 convidados, recebe os botões deles e manda o vídeo. */
          class RoomHost(private val romHash: Int) {
              private class Peer(val socket: Socket, val slot: Int, val out: DataOutputStream) {
                  val queue = ArrayBlockingQueue<ByteArray>(1)
                  @Volatile var alive = true

                  fun offer(b: ByteArray) {
                      queue.clear()
                      queue.offer(b)
                  }

                  fun close() {
                      alive = false
                      try { socket.close() } catch (e: Exception) { }
                  }
              }

              private val peers = arrayOfNulls<Peer>(RoomProto.MAX_PLAYERS) // índice = porta do controle (0 = host)
              @Volatile private var running = false
              private var server: ServerSocket? = null

              /** Jogadores na sala, contando o dono. */
              val playerCount: Int
                  get() = 1 + synchronized(peers) { (1 until RoomProto.MAX_PLAYERS).count { peers[it] != null } }

              fun start(): Boolean {
                  val srv = try {
                      val s = ServerSocket()
                      s.reuseAddress = true
                      s.bind(InetSocketAddress(RoomProto.PORT))
                      s
                  } catch (e: Exception) {
                      return false
                  }
                  server = srv
                  running = true
                  Thread { acceptLoop(srv) }.start()
                  Thread { videoLoop() }.start()
                  return true
              }

              fun stop() {
                  running = false
                  try { server?.close() } catch (e: Exception) { }
                  val list = synchronized(peers) { peers.filterNotNull() }
                  for (p in list) drop(p)
                  NativeBridge.setStreaming(false)
              }

              private fun sleep(ms: Long) {
                  try { Thread.sleep(ms) } catch (e: InterruptedException) { }
              }

              private fun acceptLoop(srv: ServerSocket) {
                  while (running) {
                      try {
                          val s = srv.accept()
                          Thread { handle(s) }.start()
                      } catch (e: Exception) {
                          if (!running) break
                          sleep(50)
                      }
                  }
              }

              private fun reply(out: DataOutputStream, status: Int, slot: Int) {
                  out.writeByte(status)
                  out.writeByte(slot)
                  out.flush()
              }

              private fun handle(s: Socket) {
                  var peer: Peer? = null
                  try {
                      s.tcpNoDelay = true
                      s.soTimeout = 5000
                      val din = DataInputStream(BufferedInputStream(s.getInputStream()))
                      val dout = DataOutputStream(BufferedOutputStream(s.getOutputStream(), 1 shl 16))
                      if (din.readInt() != RoomProto.MAGIC) { s.close(); return }
                      val ver = din.readUnsignedByte()
                      val hash = din.readInt()
                      if (ver != RoomProto.VERSION) { reply(dout, RoomProto.ST_VERSION, 0); s.close(); return }
                      if (hash != romHash) { reply(dout, RoomProto.ST_ROM, 0); s.close(); return }

                      var created: Peer? = null
                      synchronized(peers) {
                          val free = (1 until RoomProto.MAX_PLAYERS).firstOrNull { peers[it] == null }
                          if (free != null && running) {
                              val p = Peer(s, free, dout)
                              peers[free] = p
                              created = p
                          }
                      }
                      val me = created
                      if (me == null) { reply(dout, RoomProto.ST_FULL, 0); s.close(); return }
                      peer = me
                      reply(dout, RoomProto.ST_OK, me.slot)
                      s.soTimeout = 4000 // o convidado manda os botões ~60x por segundo; silêncio = caiu
                      Thread { writeLoop(me) }.start()

                      while (running && me.alive) {
                          val t = din.readUnsignedByte()
                          if (t != 1) break
                          val b = din.readUnsignedShort()
                          val lx = din.readShort().toInt()
                          val ly = din.readShort().toInt()
                          val rx = din.readShort().toInt()
                          val ry = din.readShort().toInt()
                          NativeBridge.setPad(me.slot, b, lx, ly, rx, ry)
                      }
                  } catch (e: Exception) {
                  } finally {
                      val p = peer
                      if (p != null) {
                          drop(p)
                      } else {
                          try { s.close() } catch (e: Exception) { }
                      }
                  }
              }

              private fun writeLoop(p: Peer) {
                  try {
                      while (running && p.alive) {
                          val b = p.queue.poll(300, TimeUnit.MILLISECONDS)
                          if (b == null) {
                              p.out.writeByte(3) // keepalive: o convidado nao acha que a sala caiu quando o video para
                              p.out.flush()
                              continue
                          }
                          p.out.write(b)
                          p.out.flush()
                      }
                  } catch (e: Exception) {
                  }
                  drop(p)
              }

              private fun drop(p: Peer) {
                  synchronized(peers) { if (peers[p.slot] === p) peers[p.slot] = null }
                  NativeBridge.setPad(p.slot, 0, 0, 0, 0, 0)
                  p.close()
              }

              private fun videoLoop() {
                  val size = NativeBridge.getStreamSize()
                  val w = size ushr 16
                  val h = size and 0xFFFF
                  val bmp = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888)
                  val bos = ByteArrayOutputStream(64 * 1024)
                  while (running) {
                      val any = synchronized(peers) { (1 until RoomProto.MAX_PLAYERS).any { peers[it] != null } }
                      NativeBridge.setStreaming(any)
                      if (!any) { sleep(200); continue }
                      val raw = NativeBridge.grabFrame()
                      if (raw == null) { sleep(6); continue }
                      try {
                          bmp.copyPixelsFromBuffer(ByteBuffer.wrap(raw))
                          bos.reset()
                          bmp.compress(Bitmap.CompressFormat.JPEG, 55, bos)
                      } catch (e: Exception) {
                          continue
                      }
                      val jpg = bos.toByteArray()
                      val pkt = ByteBuffer.allocate(9 + jpg.size)
                      pkt.put(2.toByte())
                      pkt.putInt(jpg.size)
                      pkt.putFloat(NativeBridge.getFrameAspect())
                      pkt.put(jpg)
                      val data = pkt.array()
                      synchronized(peers) {
                          for (i in 1 until RoomProto.MAX_PLAYERS) peers[i]?.offer(data)
                      }
                  }
                  NativeBridge.setStreaming(false)
                  bmp.recycle()
              }
          }

          /** Lado do convidado: conecta no host, recebe o vídeo e manda os botões. */
          class RoomClient(private val host: String, private val listener: Listener) {
              interface Listener {
                  fun onJoined(slot: Int)
                  fun onFrame(bmp: Bitmap, aspect: Float)
                  fun onClosed(reason: String)
              }

              private val lock = Any()
              private var buttons = 0
              private val ax = IntArray(4)
              @Volatile private var running = false
              @Volatile private var socket: Socket? = null
              private val pool = arrayOfNulls<Bitmap>(2)
              private var pi = 0

              fun setButton(id: Int, pressed: Boolean) {
                  if (id < 0 || id > 15) return
                  synchronized(lock) {
                      buttons = if (pressed) buttons or (1 shl id) else buttons and (1 shl id).inv()
                  }
              }

              fun setAnalog(which: Int, x: Float, y: Float) {
                  val base = if (which == 1) 2 else 0
                  synchronized(lock) {
                      ax[base] = (x.coerceIn(-1f, 1f) * 32767f).toInt()
                      ax[base + 1] = (y.coerceIn(-1f, 1f) * 32767f).toInt()
                  }
              }

              fun start(romHash: Int) {
                  running = true
                  Thread { session(romHash) }.start()
              }

              fun stop() {
                  running = false
                  try { socket?.close() } catch (e: Exception) { }
              }

              private fun session(romHash: Int) {
                  var joined = false
                  try {
                      val s = Socket()
                      s.connect(InetSocketAddress(host, RoomProto.PORT), 4000)
                      s.tcpNoDelay = true
                      s.soTimeout = 5000
                      socket = s
                      val din = DataInputStream(BufferedInputStream(s.getInputStream(), 1 shl 16))
                      val dout = DataOutputStream(BufferedOutputStream(s.getOutputStream()))
                      dout.writeInt(RoomProto.MAGIC)
                      dout.writeByte(RoomProto.VERSION)
                      dout.writeInt(romHash)
                      dout.flush()
                      val status = din.readUnsignedByte()
                      val slot = din.readUnsignedByte()
                      if (status != RoomProto.ST_OK) {
                          running = false
                          val msg = when (status) {
                              RoomProto.ST_ROM -> "Você não tem a mesma ROM do dono da sala. Escolha o mesmo jogo (mesmo arquivo de ROM)."
                              RoomProto.ST_FULL -> "A sala está cheia (máximo de 4 jogadores)."
                              else -> "O app do dono da sala é de outra versão. Atualizem os dois."
                          }
                          listener.onClosed(msg)
                          return
                      }
                      joined = true
                      s.soTimeout = 15000
                      listener.onJoined(slot)
                      Thread { sendLoop(dout) }.start()
                      while (running) {
                          val t = din.readUnsignedByte()
                          if (t == 3) continue
                          if (t != 2) break
                          val len = din.readInt()
                          val aspect = din.readFloat()
                          if (len <= 0 || len > 2000000) break
                          val b = ByteArray(len)
                          din.readFully(b)
                          decode(b, aspect)
                      }
                  } catch (e: Exception) {
                  } finally {
                      val was = running
                      running = false
                      try { socket?.close() } catch (e: Exception) { }
                      if (was) {
                          listener.onClosed(
                              if (joined) "A sala foi fechada ou a conexão caiu."
                              else "Não consegui entrar na sala. Confira o código e se os dois estão na mesma rede Wi-Fi."
                          )
                      }
                  }
              }

              private fun sendLoop(out: DataOutputStream) {
                  try {
                      val a = IntArray(4)
                      while (running) {
                          var b = 0
                          synchronized(lock) {
                              b = buttons
                              for (i in 0..3) a[i] = ax[i]
                          }
                          out.writeByte(1)
                          out.writeShort(b)
                          out.writeShort(a[0])
                          out.writeShort(a[1])
                          out.writeShort(a[2])
                          out.writeShort(a[3])
                          out.flush()
                          Thread.sleep(16)
                      }
                  } catch (e: Exception) {
                      try { socket?.close() } catch (x: Exception) { }
                  }
              }

              private fun decode(b: ByteArray, aspect: Float) {
                  val o = BitmapFactory.Options()
                  o.inMutable = true
                  val reuse = pool[pi]
                  if (reuse != null && !reuse.isRecycled) o.inBitmap = reuse
                  var bmp: Bitmap? = try {
                      BitmapFactory.decodeByteArray(b, 0, b.size, o)
                  } catch (e: Exception) {
                      null
                  }
                  if (bmp == null && o.inBitmap != null) {
                      o.inBitmap = null
                      bmp = try {
                          BitmapFactory.decodeByteArray(b, 0, b.size, o)
                      } catch (e: Exception) {
                          null
                      }
                  }
                  if (bmp != null) {
                      pool[pi] = bmp
                      pi = 1 - pi
                      listener.onFrame(bmp, aspect)
                  }
              }
          }

          /** Tela do convidado: desenha o último quadro recebido, mantendo a proporção. */
          class GuestView(ctx: Context) : View(ctx) {
              @Volatile private var bmp: Bitmap? = null
              @Volatile private var aspect = 4f / 3f
              private val paint = Paint(Paint.FILTER_BITMAP_FLAG)
              private val dst = RectF()

              fun show(b: Bitmap, a: Float) {
                  bmp = b
                  if (a > 0f) aspect = a
                  postInvalidate()
              }

              override fun onDraw(c: Canvas) {
                  c.drawColor(Color.BLACK)
                  val b = bmp ?: return
                  val w = width.toFloat()
                  val h = height.toFloat()
                  var dw = w
                  var dh = w / aspect
                  if (dh > h) {
                      dh = h
                      dw = h * aspect
                  }
                  val dx = (w - dw) / 2f
                  val dy = (h - dh) / 2f
                  dst.set(dx, dy, dx + dw, dy + dh)
                  c.drawBitmap(b, null, dst, paint)
              }
          }
