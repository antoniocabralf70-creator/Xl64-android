          package dev.n64emu.app

          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.net.Uri
          import java.io.File
          import java.net.HttpURLConnection
          import java.net.URL
          import java.net.URLEncoder

          private val COV_STOP = setOf("the", "of", "and", "a", "an", "in", "de", "la", "le", "no")

          /** Tira etiquetas "(USA)", "[!]", "Disc 1" e troca "_" por espaço. */
          private fun covClean(s: String): String =
              s.replace('_', ' ')
                  .replace(Regex("\\s*[\\(\\[][^\\)\\]]*[\\)\\]]"), " ")
                  .replace(Regex("(?i)\\b(disc|disk|cd)\\s*\\d+\\b"), " ")
                  .trim()

          /** Só letras e números, minúsculo: serve para comparar nomes iguais escritos de jeitos diferentes. */
          private fun covNorm(s: String): String = covClean(s).lowercase().replace(Regex("[^a-z0-9]"), "")

          /** Palavras do nome (sem "the", "of"...), para achar nomes parecidos. */
          private fun covWords(s: String): Set<String> =
              covClean(s).lowercase().split(Regex("[^a-z0-9]+")).filter { it.isNotEmpty() && it !in COV_STOP }.toSet()

          private fun covScore(a: Set<String>, b: Set<String>): Double {
              if (a.isEmpty() || b.isEmpty()) return 0.0
              var inter = 0
              for (w in a) if (w in b) inter++
              val union = a.size + b.size - inter
              return inter.toDouble() / union.toDouble()
          }

          private class CovIndex(val names: List<String>) {
              val norms: List<String> = names.map { covNorm(it) }
              val words: List<Set<String>> = names.map { covWords(it) }
          }

          object Covers {
              fun dir(ctx: Context): File = File(ctx.filesDir, "covers").apply { mkdirs() }

              private val indexes = HashMap<String, CovIndex>()

              /** Tipos de imagem do libretro, do melhor para o pior: capa, tela de título, captura de tela. */
              private val KINDS = listOf("Named_Boxarts", "Named_Titles", "Named_Snaps")

              /** Nome interno de algumas ROMs de N64 -> nome do jogo no libretro. */
              private val ALIAS = mapOf(
                  "the legend of zelda" to "Legend of Zelda, The - Ocarina of Time",
                  "zelda majora's mask" to "Legend of Zelda, The - Majora's Mask",
                  "smash brothers" to "Super Smash Bros.",
                  "goldeneye" to "GoldenEye 007",
                  "starfox64" to "Star Fox 64",
                  "mariokart64" to "Mario Kart 64",
                  "dr.mario 64" to "Dr. Mario 64",
                  "kirby64" to "Kirby 64 - The Crystal Shards",
                  "conker bfd" to "Conker's Bad Fur Day",
                  "banjo tooie" to "Banjo-Tooie",
                  "1080 snowboarding" to "1080 TenEighty Snowboarding",
                  "excitebike64" to "Excitebike 64",
                  "diddy kong racing" to "Diddy Kong Racing",
                  "wave race 64" to "Wave Race 64"
              )

              private fun folderOf(g: Game) = when (g.system) {
                  "ps1" -> "Sony%20-%20PlayStation"
                  "psp" -> "Sony%20-%20PlayStation%20Portable"
                  else -> "Nintendo%20-%20Nintendo%2064"
              }

              private fun open(url: String, connectMs: Int, readMs: Int): HttpURLConnection {
                  val c = URL(url).openConnection() as HttpURLConnection
                  c.connectTimeout = connectMs
                  c.readTimeout = readMs
                  c.setRequestProperty("User-Agent", "muntdroid")
                  return c
              }

              private fun downloadListing(folder: String, kind: String): List<String>? {
                  try {
                      val c = open("https://thumbnails.libretro.com/$folder/$kind/", 10000, 40000)
                      if (c.responseCode != 200) return null
                      val html = c.inputStream.bufferedReader().use { it.readText() }
                      val out = ArrayList<String>()
                      for (m in Regex("href=\"([^\"]+?)\\.png\"").findAll(html)) {
                          out.add(Uri.decode(m.groupValues[1].replace("&amp;", "&")))
                      }
                      return if (out.isEmpty()) null else out
                  } catch (e: Exception) {
                      return null
                  }
              }

              /** Lista de imagens do libretro para o console: guardada no aparelho por 7 dias e na memória. */
              @Synchronized
              private fun index(ctx: Context, folder: String, kind: String): CovIndex? {
                  val key = folder + "/" + kind
                  indexes[key]?.let { return it }
                  val cache = File(ctx.cacheDir, "cover_list_" + Math.abs(key.hashCode()) + ".txt")
                  var names: List<String>? = null
                  if (cache.exists() && System.currentTimeMillis() - cache.lastModified() < 7L * 24L * 3600L * 1000L) {
                      try {
                          names = cache.readLines().filter { it.isNotEmpty() }
                      } catch (e: Exception) {
                      }
                  }
                  if (names == null || names.isEmpty()) {
                      val fresh = downloadListing(folder, kind)
                      if (fresh != null) {
                          names = fresh
                          try {
                              cache.writeText(fresh.joinToString("\n"))
                          } catch (e: Exception) {
                          }
                      }
                  }
                  val list: List<String> = names ?: return null
                  if (list.isEmpty()) return null
                  val idx = CovIndex(list)
                  indexes[key] = idx
                  return idx
              }

              private fun rank(n: String): Int = when {
                  n.contains("(USA") -> 0
                  n.contains("(World") -> 1
                  n.contains("(Europe") -> 2
                  else -> 3
              }

              /** Acha o nome mais parecido: igual (sem etiquetas) ganha de tudo; senão, mais palavras em comum. */
              private fun matchName(titles: List<String>, idx: CovIndex): String? {
                  var best: String? = null
                  var bestKey = Double.NEGATIVE_INFINITY
                  for (title in titles) {
                      val nt = covNorm(title)
                      if (nt.isEmpty()) continue
                      val tw = covWords(title)
                      for (i in idx.names.indices) {
                          val s = if (idx.norms[i] == nt) 2.0 else covScore(tw, idx.words[i])
                          if (s < 0.6) continue
                          val name = idx.names[i]
                          val key = s * 1000.0 - rank(name) * 10.0 - name.length * 0.01
                          if (key > bestKey) {
                              bestKey = key
                              best = name
                          }
                      }
                  }
                  return best
              }

              private fun titlesOf(g: Game): List<String> {
                  val list = ArrayList<String>()
                  list.add(g.title)
                  val rn = g.romName.trim()
                  if (rn.isNotEmpty()) {
                      val alias = ALIAS[rn.lowercase()]
                      if (alias != null) list.add(alias)
                      list.add(rn)
                  }
                  return list
              }

              private fun download(ctx: Context, g: Game, folder: String, kind: String, name: String): String? {
                  try {
                      val enc = URLEncoder.encode(name, "UTF-8").replace("+", "%20")
                      val c = open("https://thumbnails.libretro.com/$folder/$kind/$enc.png", 8000, 15000)
                      if (c.responseCode != 200) return null
                      val out = File(dir(ctx), g.id + ".png")
                      c.inputStream.use { i -> out.outputStream().use { o -> i.copyTo(o) } }
                      if (out.length() < 200L) {
                          out.delete()
                          return null
                      }
                      return out.absolutePath
                  } catch (e: Exception) {
                      return null
                  }
              }

              /** Busca a capa nos thumbnails do libretro: nome exato, depois nome parecido; sem capa, usa a tela de título. */
              fun fetchOnline(ctx: Context, g: Game): String? {
                  val folder = folderOf(g)
                  val titles = titlesOf(g)
                  for (t in titles.take(2)) {
                      val exact = t.replace(Regex("[&*/:`<>?\\\\|\"]"), "_")
                      download(ctx, g, folder, "Named_Boxarts", exact)?.let { return it }
                  }
                  for (kind in KINDS) {
                      val idx = index(ctx, folder, kind) ?: continue
                      val m = matchName(titles, idx) ?: continue
                      download(ctx, g, folder, kind, m)?.let { return it }
                  }
                  return null
              }

              fun saveFromUri(ctx: Context, uri: Uri, id: String): String? {
                  try {
                      val bounds = BitmapFactory.Options()
                      bounds.inJustDecodeBounds = true
                      ctx.contentResolver.openInputStream(uri)?.use { BitmapFactory.decodeStream(it, null, bounds) }
                      var s = 1
                      while (bounds.outWidth / s > 600) s *= 2
                      val opts = BitmapFactory.Options()
                      opts.inSampleSize = s
                      val bmp = ctx.contentResolver.openInputStream(uri)?.use { BitmapFactory.decodeStream(it, null, opts) } ?: return null
                      val f = File(dir(ctx), "$id.jpg")
                      f.outputStream().use { bmp.compress(Bitmap.CompressFormat.JPEG, 90, it) }
                      return f.absolutePath
                  } catch (e: Exception) {
                      return null
                  }
              }

              fun load(path: String, maxW: Int): Bitmap? {
                  try {
                      val bounds = BitmapFactory.Options()
                      bounds.inJustDecodeBounds = true
                      BitmapFactory.decodeFile(path, bounds)
                      var s = 1
                      while (bounds.outWidth / (s * 2) >= maxW) s *= 2
                      val opts = BitmapFactory.Options()
                      opts.inSampleSize = s
                      return BitmapFactory.decodeFile(path, opts)
                  } catch (e: Exception) {
                      return null
                  }
              }
          }
