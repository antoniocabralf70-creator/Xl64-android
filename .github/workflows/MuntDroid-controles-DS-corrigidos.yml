      - name: Baixar núcleo PSP (PPSSPP) e arquivos de sistema
        run: |
          set -euo pipefail
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/assets
          BASE=https://buildbot.libretro.com/nightly/android/latest/arm64-v8a
          ok=0
          for try in 1 2 3; do
            if curl -fL --retry 3 --retry-delay 3 -o pspcore.zip "$BASE/ppsspp_libretro_android.so.zip" && unzip -tq pspcore.zip; then
              ok=1
              break
            fi
            echo "tentativa $try de baixar o nucleo PSP falhou"
            sleep 5
          done
          if [ "$ok" != 1 ]; then
            echo "::error::Nao consegui baixar o nucleo ppsspp (PSP) do buildbot do libretro."
            exit 1
          fi
          rm -rf psp_tmp
          unzip -o pspcore.zip -d psp_tmp
          SO=$(find psp_tmp -type f -name '*.so' -print -quit)
          if [ -z "$SO" ]; then
            echo "::error::O zip do nucleo PSP nao tem nenhum .so"
            exit 1
          fi
          CORE=app/src/main/jniLibs/arm64-v8a/libppsspp_core.so
          cp "$SO" "$CORE"
          SIZE=$(stat -c %s "$CORE")
          echo "nucleo PSP: $(basename "$SO") ($SIZE bytes)"
          if [ "$SIZE" -lt 1000000 ]; then
            echo "::error::Nucleo PSP pequeno demais, download corrompido?"
            exit 1
          fi
          if ! readelf -h "$CORE" | grep -q 'AArch64'; then
            echo "::error::O nucleo PSP baixado nao e arm64-v8a"
            exit 1
          fi
          readelf --dyn-syms -W "$CORE" > psp_syms.txt
          MISSING=0
          for sym in retro_set_environment retro_set_video_refresh retro_set_audio_sample retro_set_audio_sample_batch retro_set_input_poll retro_set_input_state retro_init retro_deinit retro_get_system_info retro_get_system_av_info retro_load_game retro_unload_game retro_run; do
            if grep -qE " $sym\$" psp_syms.txt; then
              echo "ok     $sym"
            else
              echo "FALTA  $sym"
              MISSING=1
            fi
          done
          if [ "$MISSING" != 0 ]; then
            echo "::error::O nucleo PSP nao exporta as funcoes libretro necessarias"
            exit 1
          fi
          echo "== dependencias do nucleo PSP =="
          readelf -d "$CORE" | grep NEEDED || true
          if readelf -d "$CORE" | grep -q 'libc++_shared.so' && [ ! -f app/src/main/jniLibs/arm64-v8a/libc++_shared.so ]; then
            STL=$(find "$ANDROID_HOME/ndk" -path '*aarch64-linux-android/libc++_shared.so' | sort | tail -n 1)
            if [ -z "$STL" ]; then
              echo "::error::libc++_shared.so nao encontrada no NDK"
              exit 1
            fi
            cp "$STL" app/src/main/jniLibs/arm64-v8a/
          fi
          echo "== arquivos de sistema do PPSSPP (fontes e atlas) =="
          ok=0
          for try in 1 2 3; do
            if curl -fL --retry 3 --retry-delay 3 -o app/src/main/assets/PPSSPP.zip https://buildbot.libretro.com/assets/system/PPSSPP.zip && unzip -tq app/src/main/assets/PPSSPP.zip; then
              ok=1
              break
            fi
            echo "tentativa $try de baixar os arquivos de sistema do PPSSPP falhou"
            sleep 5
          done
          if [ "$ok" != 1 ]; then
            rm -f app/src/main/assets/PPSSPP.zip
            echo "::warning::Nao consegui baixar PPSSPP.zip: o PSP abre, mas sem as fontes do sistema."
          else
            ls -la app/src/main/assets
          fi
          ls -la app/src/main/jniLibs/arm64-v8a
      - name: Baixar núcleo Nintendo DS (melonDS DS)
        run: |
          set -euo pipefail
          mkdir -p app/src/main/jniLibs/arm64-v8a
          BASE=https://buildbot.libretro.com/nightly/android/latest/arm64-v8a
          curl -fL --retry 3 --retry-delay 3 -o ndscore.zip "$BASE/melondsds_libretro_android.so.zip"
          unzip -tq ndscore.zip
          rm -rf nds_tmp && mkdir -p nds_tmp
          unzip -o ndscore.zip -d nds_tmp
          SO=$(find nds_tmp -type f -name '*.so' -print -quit)
          test -n "$SO"
          cp "$SO" app/src/main/jniLibs/arm64-v8a/libmelonds_core.so
          CORE=app/src/main/jniLibs/arm64-v8a/libmelonds_core.so
          test "$(stat -c %s "$CORE")" -gt 500000
          readelf -h "$CORE" | grep -q AArch64
          readelf --dyn-syms -W "$CORE" > nds_syms.txt
          for sym in retro_set_environment retro_set_video_refresh retro_set_audio_sample retro_set_audio_sample_batch retro_set_input_poll retro_set_input_state retro_init retro_deinit retro_get_system_info retro_get_system_av_info retro_load_game retro_unload_game retro_run; do
            grep -qE " $sym\$" nds_syms.txt || { echo "::error::melonDS DS sem símbolo $sym"; exit 1; }
          done
          echo "Núcleo melonDS DS ARM64 instalado"
      - name: Build muntdroid APK debug
        run: gradle assembleDebug
