                  i.putExtra("mode", mode)
                  i.putExtra("code", code)
                  startActivity(i)
              }

              private fun onRomsPicked(uris: List<Uri>) {
                  var added = 0
                  val names = HashMap<Uri, String>()
                  for (uri in uris) {
                      try {
                          contentResolver.takePersistableUriPermission(uri, Intent.FLAG_GRANT_READ_URI_PERMISSION)
                      } catch (e: Exception) {
                      }
                      names[uri] = Ps1Files.fileName(this, uri)
                  }
                  fun extOf(u: Uri): String = (names[u] ?: "").substringAfterLast('.', "").lowercase()
                  // .bin/.img escolhidos junto com o .cue viram parte do jogo do .cue
                  val used = HashSet<Uri>()
                  val cueExtras = HashMap<Uri, List<Uri>>()
                  for (u in uris) {
                      if (extOf(u) != "cue") continue
                      val refs = Rom.cueFiles(this, u).map { it.lowercase() }
                      val found = refs.mapNotNull { r -> uris.firstOrNull { x -> x != u && (names[x] ?: "").lowercase() == r } }.distinct()
                      cueExtras[u] = found
                      used.addAll(found)
                  }
                  for (uri in uris) {
                      if (uri in used) continue
                      if (library.games.any { it.uri == uri.toString() }) continue
                      val sys = Rom.systemOf(this, uri, names[uri] ?: "")
                      val g = Game(
                          UUID.randomUUID().toString(), uri.toString(), Rom.displayName(this, uri),
                          if (sys != "n64") "" else Rom.internalName(this, uri), null,
                          sys, (cueExtras[uri] ?: emptyList()).map { it.toString() }
                      )
                      library.add(g)
                      added++
                      Achievements.raise(this, "library", library.games.size)
                      Achievements.add(this, when (sys) { "ps1" -> "psx_added"; "psp" -> "psp_added"; else -> "n64_added" }, 1)
                      Thread {
                          val p = Covers.fetchOnline(this, g)
                          if (p != null) {
                              g.cover = p
                              Achievements.add(this, "covers", 1)
                              library.save()
                              runOnUiThread { games.refresh() }
                          }
                      }.start()
                  }
                  games.refresh()
                  if (added == 0 && uris.isNotEmpty()) {
                      Toast.makeText(this, "Esse jogo já está na lista.", Toast.LENGTH_SHORT).show()
                  }
              }

              private fun onCoverPicked(uri: Uri?) {
                  val id = coverTarget
                  if (uri == null || id == null) return
                  Thread {
                      val p = Covers.saveFromUri(this, uri, id)
                      runOnUiThread {
                          if (p != null) {
                              library.find(id)?.cover = p
                              Achievements.add(this, "own_covers", 1)
                              library.save()
                              games.refresh()
                          } else {
                              Toast.makeText(this, "Não consegui usar essa imagem.", Toast.LENGTH_LONG).show()
                          }
                      }
                  }.start()
              }
          }
