                          "Digite o código da sala e escolha o mesmo jogo (a mesma ROM) que o dono da sala está usando. Se a ROM for diferente, a sala não deixa entrar.",
                          13f, Ui.SUB
                      )
                  )
                  join.addView(Ui.button(act, "Entrar com código") { askCode() })
                  col.addView(join)
              }

              private fun pickGame(title: String, onPick: (Game) -> Unit) {
                  val list = act.library.games.toList()
                  if (list.isEmpty()) {
                      Toast.makeText(act, "Adicione um jogo primeiro na aba Jogos.", Toast.LENGTH_LONG).show()
                      return
                  }
                  val names = list.map { it.title }.toTypedArray()
                  AlertDialog.Builder(act)
                      .setTitle(title)
                      .setItems(names) { _, i -> onPick(list[i]) }
                      .setNegativeButton("Cancelar", null)
                      .show()
              }

              private fun createRoom(g: Game) {
                  val ip = RoomNet.localIp()
                  val code = if (ip != null) RoomCode.encode(ip) else null
                  if (code == null) {
                      Toast.makeText(act, "Sem rede. Conecte no Wi-Fi ou ative o roteador portátil e tente de novo.", Toast.LENGTH_LONG).show()
                      return
                  }
                  AlertDialog.Builder(act)
                      .setTitle("Sala pronta")
                      .setMessage("Código: ${RoomCode.pretty(code)}\n\nPasse esse código para os outros jogadores (até 3). Eles entram pela aba Sala > Entrar com código, com a mesma ROM de \"${g.title}\".\n\nO código aparece no topo da tela durante o jogo.")
                      .setPositiveButton("Iniciar jogo") { _, _ -> act.launchRoom(g, "host", code) }
                      .setNegativeButton("Cancelar", null)
                      .show()
              }

              private fun askCode() {
                  val et = EditText(act)
                  et.hint = "Código da sala"
                  et.inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_FLAG_CAP_CHARACTERS or InputType.TYPE_TEXT_FLAG_NO_SUGGESTIONS
                  et.setPadding(dp(20), dp(14), dp(20), dp(14))
                  AlertDialog.Builder(act)
                      .setTitle("Entrar numa sala")
                      .setView(et)
                      .setPositiveButton("Continuar") { _, _ ->
                          val raw = et.text.toString()
                          if (RoomCode.decode(raw) == null) {
                              Toast.makeText(act, "Código inválido.", Toast.LENGTH_LONG).show()
                          } else {
                              pickGame("Qual jogo você tem? (o mesmo da sala)") { g -> act.launchRoom(g, "guest", raw) }
                          }
                      }
                      .setNegativeButton("Cancelar", null)
                      .show()
              }
          }
