          package dev.n64emu.app

          import android.content.Context
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.File
          import java.io.RandomAccessFile
          import java.util.zip.CRC32

          data class GamePatch(val file: String, val name: String, val enabled: Boolean)

          object ModManager {
              @Volatile var pendingGameId: String? = null
              private fun prefs(c: Context) = c.getSharedPreferences("muntdroid_game_mods", Context.MODE_PRIVATE)
              fun patchDir(c: Context, id: String) = File(c.filesDir, "mods/$id/patches")
              fun textureDir(c: Context, g: Game) = File(Storage.hiresDir(c), (if (g.romName.isNotBlank()) g.romName else g.title.uppercase()).replace(Regex("[/\\\\:*?\"<>|]"), "_"))
              fun textureEnabled(c: Context, id: String) = prefs(c).getBoolean("tex_$id", false)
              fun setTextureEnabled(c: Context, id: String, on: Boolean) { prefs(c).edit().putBoolean("tex_$id", on).apply() }
              fun patches(c: Context, id: String): List<GamePatch> {
                  val a = try { JSONArray(prefs(c).getString("patches_$id", "[]")) } catch (_: Exception) { JSONArray() }
                  return (0 until a.length()).mapNotNull { i -> try {
                      val o = a.getJSONObject(i); val f = o.getString("file")
                      if (!File(f).exists()) null else GamePatch(f, o.optString("name", File(f).name), o.optBoolean("enabled", false))
                  } catch (_: Exception) { null } }
              }
              fun addPatch(c: Context, id: String, f: File) {
                  val a = JSONArray()
                  patches(c, id).filter { it.file != f.absolutePath }.forEach { old -> a.put(JSONObject().put("file", old.file).put("name", old.name).put("enabled", old.enabled)) }
                  a.put(JSONObject().put("file", f.absolutePath).put("name", f.name).put("enabled", false))
                  prefs(c).edit().putString("patches_$id", a.toString()).apply()
              }
              fun setPatchEnabled(c: Context, id: String, file: String, on: Boolean) {
                  val a = JSONArray()
                  patches(c, id).forEach { p -> a.put(JSONObject().put("file", p.file).put("name", p.name).put("enabled", if (p.file == file) on else p.enabled)) }
                  prefs(c).edit().putString("patches_$id", a.toString()).apply()
              }
              fun applyEnabledPatches(c: Context, id: String, source: File): File {
                  val enabled = patches(c, id).filter { it.enabled }
                  if (enabled.isEmpty()) return source
                  var bytes = source.readBytes()
                  for (p in enabled) {
                      val patch = File(p.file).readBytes()
                      bytes = when (p.file.substringAfterLast('.', "").lowercase()) {
                          "ips" -> applyIps(bytes, patch)
                          "bps" -> applyBps(bytes, patch)
                          else -> throw IllegalArgumentException("Formato de patch não suportado")
                      }
                  }
                  val out = File(c.cacheDir, "patched_${id}_${source.name}")
                  out.writeBytes(bytes)
                  return out
              }
              private fun applyIps(src: ByteArray, patch: ByteArray): ByteArray {
                  require(patch.size >= 8 && String(patch, 0, 5, Charsets.US_ASCII) == "PATCH") { "Arquivo IPS inválido" }
                  val out = src.copyOf(maxOf(src.size, 1))
                  var data = out
                  var pos = 5
                  while (pos + 3 <= patch.size) {
                      if (String(patch, pos, 3, Charsets.US_ASCII) == "EOF") break
                      val off = ((patch[pos].toInt() and 255) shl 16) or ((patch[pos+1].toInt() and 255) shl 8) or (patch[pos+2].toInt() and 255); pos += 3
                      require(pos + 2 <= patch.size) { "IPS truncado" }
                      var len = ((patch[pos].toInt() and 255) shl 8) or (patch[pos+1].toInt() and 255); pos += 2
                      var run = -1; var value = 0
                      if (len == 0) { require(pos + 3 <= patch.size); len = ((patch[pos].toInt() and 255) shl 8) or (patch[pos+1].toInt() and 255); value = patch[pos+2].toInt() and 255; pos += 3; run = value }
                      require(len >= 0 && off.toLong() + len <= 128L * 1024 * 1024) { "IPS excede tamanho permitido" }
                      if (off + len > data.size) data = data.copyOf(off + len)
                      if (run >= 0) java.util.Arrays.fill(data, off, off + len, run.toByte()) else { require(pos + len <= patch.size); System.arraycopy(patch, pos, data, off, len); pos += len }
                  }
                  return data
              }
              private fun applyBps(src: ByteArray, p: ByteArray): ByteArray {
                  require(p.size >= 16 && String(p, 0, 4, Charsets.US_ASCII) == "BPS1") { "Arquivo BPS inválido" }
                  fun crc(b: ByteArray, from: Int = 0, len: Int = b.size): Long { val c = CRC32(); c.update(b, from, len); return c.value }
                  fun readVar(state: IntArray): Long { var data = 0L; var shift = 1L; while (true) { require(state[0] < p.size - 12) { "BPS truncado" }; val x = p[state[0]++].toInt() and 255; data += (x and 0x7f) * shift; if ((x and 0x80) != 0) return data; shift = shift shl 7; data += shift } }
                  require(crc(p, 0, p.size - 4) == le32(p, p.size - 4)) { "CRC do patch BPS incorreto" }
                  val st = intArrayOf(4); val sourceSize = readVar(st).toInt(); val targetSize = readVar(st).toInt(); val meta = readVar(st).toInt()
                  require(sourceSize == src.size && targetSize <= 128 * 1024 * 1024 && meta >= 0 && st[0] + meta <= p.size - 12) { "Patch BPS não corresponde a esta ROM" }
                  st[0] += meta
                  val out = ByteArray(targetSize); var op = 0; var sourceRel = 0; var targetRel = 0
                  while (op < targetSize) {
                      val cmd = readVar(st); val len = ((cmd ushr 2) + 1).toInt(); require(op + len <= targetSize)
                      when ((cmd and 3).toInt()) {
                          0 -> { require(op + len <= src.size); System.arraycopy(src, op, out, op, len) }
                          1 -> { require(st[0] + len <= p.size - 12); System.arraycopy(p, st[0], out, op, len); st[0] += len }
                          2 -> { sourceRel += signed(readVar(st)).toInt(); require(sourceRel >= 0 && sourceRel + len <= src.size); System.arraycopy(src, sourceRel, out, op, len); sourceRel += len }
                          3 -> { targetRel += signed(readVar(st)).toInt(); require(targetRel >= 0 && targetRel < op); for (i in 0 until len) { require(targetRel + i < op + i); out[op+i] = out[targetRel+i] }; targetRel += len }
                      }
                      op += len
                  }
                  require(crc(src) == le32(p, p.size - 12)) { "A ROM original não corresponde ao patch BPS" }
                  require(crc(out) == le32(p, p.size - 8)) { "Resultado do patch BPS inválido" }
                  return out
              }
              private fun signed(v: Long): Long = if ((v and 1L) != 0L) -(v ushr 1) else (v ushr 1)
              private fun le32(b: ByteArray, i: Int): Long = (b[i].toLong() and 255) or ((b[i+1].toLong() and 255) shl 8) or ((b[i+2].toLong() and 255) shl 16) or ((b[i+3].toLong() and 255) shl 24)
          }
