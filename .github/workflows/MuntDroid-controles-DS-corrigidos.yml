          package dev.n64emu.app

          import android.content.Context
          import java.io.File
          import java.util.zip.ZipInputStream

          /**
           * O PPSSPP precisa de arquivos de sistema (fontes e atlas do PSP) em <system>/PPSSPP.
           * Eles vêm dentro do APK (assets/PPSSPP.zip) e são copiados uma única vez.
           */
          object PspAssets {
              fun ensure(ctx: Context, sys: File) {
                  val marker = File(sys, "PPSSPP/.ok")
                  if (marker.exists()) return
                  try {
                      val root = sys.canonicalFile
                      ctx.assets.open("PPSSPP.zip").use { raw ->
                          ZipInputStream(raw).use { zin ->
                              while (true) {
                                  val e = zin.nextEntry ?: break
                                  var name = e.name.replace('\\', '/')
                                  if (!name.startsWith("PPSSPP/")) name = "PPSSPP/" + name
                                  val out = File(root, name).canonicalFile
                                  if (!out.path.startsWith(root.path + File.separator)) continue
                                  if (e.isDirectory) {
                                      out.mkdirs()
                                      continue
                                  }
                                  out.parentFile?.mkdirs()
                                  out.outputStream().use { zin.copyTo(it) }
                              }
                          }
                      }
                      File(root, "PPSSPP").mkdirs()
                      marker.writeText("ok")
                  } catch (e: Exception) {
                      // sem o pacote no APK (ou erro ao copiar): o núcleo ainda abre, mas sem as fontes do PSP
                  }
              }
          }
