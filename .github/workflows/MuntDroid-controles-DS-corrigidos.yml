              private fun thumbFile(slot: Int) = File(Storage.savesDir(this), "$saveName.state$slot.jpg")

              private fun closeMenu() {
                  try { menuDialog?.dismiss() } catch (e: Throwable) {}
                  menuDialog = null
                  menuOpen = false
                  try { NativeBridge.resume() } catch (e: Throwable) {}
              }

              private fun openMenu() {
                  if (menuOpen || isFinishing || !started) return
                  menuOpen = true
                  try { NativeBridge.pause() } catch (e: Throwable) {}
                  val d = Dialog(this)
                  d.requestWindowFeature(Window.FEATURE_NO_TITLE)
                  d.window?.setBackgroundDrawable(ColorDrawable(Color.TRANSPARENT))
                  d.window?.setDimAmount(0.65f)
                  d.setOnCancelListener { closeMenu() }
                  menuDialog = d
                  showMain()
                  d.show()
              }

              private fun menuButton(label: String, bg: Int, onClick: () -> Unit): TextView {
                  val t = Ui.text(this, label, 16f, Ui.TEXT, true)
                  t.gravity = Gravity.CENTER_VERTICAL
                  t.setPadding(dp(18), 0, dp(18), 0)
                  t.background = Ui.rounded(bg, dp(14))
                  t.setOnClickListener { onClick() }
                  val lp = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, dp(48))
                  lp.topMargin = dp(8)
                  t.layoutParams = lp
                  return t
              }

              private fun panel(title: String, subtitle: String): LinearLayout {
                  val p = LinearLayout(this)
                  p.orientation = LinearLayout.VERTICAL
                  p.background = Ui.rounded(Ui.CARD, dp(22))
                  p.setPadding(dp(20), dp(18), dp(20), dp(16))
                  p.addView(Ui.text(this, title, 20f, Ui.TEXT, true))
                  val s = Ui.text(this, subtitle, 13f, Ui.SUB)
                  s.setPadding(0, dp(2), 0, dp(6))
                  s.maxLines = 1
                  p.addView(s)
                  return p
              }

              private fun showPanel(p: View, widthDp: Int) {
                  val d = menuDialog ?: return
                  val sv = ScrollView(this)
                  sv.addView(p)
                  d.setContentView(sv)
                  val maxW = (resources.displayMetrics.widthPixels * 0.92f).toInt()
                  d.window?.setLayout(minOf(dp(widthDp), maxW), ViewGroup.LayoutParams.WRAP_CONTENT)
              }

              private fun showMain() {
                  val p = panel("Menu do jogo", saveName.replace('_', ' '))
                  val dark = 0xFF2A2A3C.toInt()
                  p.addView(menuButton("▶    Continuar", Ui.ACCENT) { closeMenu() })
                  p.addView(menuButton("💾    Salvar estado", dark) { showSlots(true) })
                  p.addView(menuButton("📂    Carregar estado", dark) { showSlots(false) })
                  p.addView(menuButton("⏏    Sair do jogo", 0xFF5B2333.toInt()) {
                      try { menuDialog?.dismiss() } catch (e: Throwable) {}
                      menuDialog = null
                      menuOpen = false
                      finish()
                  })
                  showPanel(p, 340)
              }

              private fun showSlots(save: Boolean) {
                  val p = panel(if (save) "Salvar estado" else "Carregar estado", "Escolha um slot")
                  val row = LinearLayout(this)
                  row.orientation = LinearLayout.HORIZONTAL
                  val dark = 0xFF2A2A3C.toInt()
                  val fmt = java.text.SimpleDateFormat("dd/MM  HH:mm", java.util.Locale.getDefault())
                  for (slot in 1..slotCount) {
                      val f = stateFile(slot)
                      val exists = f.exists()
                      val card = LinearLayout(this)
                      card.orientation = LinearLayout.VERTICAL
                      card.background = Ui.rounded(dark, dp(14))
                      card.setPadding(dp(8), dp(8), dp(8), dp(10))
                      val lp = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                      if (slot > 1) lp.leftMargin = dp(10)
                      card.layoutParams = lp

                      val tf = thumbFile(slot)
                      val bmp = if (exists && tf.exists()) BitmapFactory.decodeFile(tf.absolutePath) else null
                      val thumbLp = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, dp(84))
                      if (bmp != null) {
                          val img = ImageView(this)
                          img.scaleType = ImageView.ScaleType.CENTER_CROP
                          img.setImageBitmap(bmp)
                          img.background = Ui.rounded(0xFF14141C.toInt(), dp(10))
                          img.clipToOutline = true
                          img.layoutParams = thumbLp
                          card.addView(img)
                      } else {
                          val ph = Ui.text(this, if (exists) "sem imagem" else "vazio", 13f, Ui.SUB)
                          ph.gravity = Gravity.CENTER
                          ph.background = Ui.rounded(0xFF14141C.toInt(), dp(10))
                          ph.layoutParams = thumbLp
                          card.addView(ph)
                      }
                      val name = Ui.text(this, "Slot $slot", 15f, Ui.TEXT, true)
                      name.setPadding(dp(2), dp(8), 0, 0)
                      card.addView(name)
                      val sub = Ui.text(this, if (exists) fmt.format(java.util.Date(f.lastModified())) else "—", 12f, Ui.SUB)
                      sub.setPadding(dp(2), 0, 0, 0)
                      card.addView(sub)
                      if (!save && !exists) card.alpha = 0.45f
                      card.setOnClickListener {
                          if (!save && !exists) {
                              Toast.makeText(this, "Slot $slot está vazio", Toast.LENGTH_SHORT).show()
                          } else {
                              doState(save, slot)
                          }
                      }
                      row.addView(card)
                  }
                  p.addView(row)
                  p.addView(menuButton("‹    Voltar", dark) { showMain() })
                  showPanel(p, 560)
              }

              private fun finishState(ok: Boolean, save: Boolean, slot: Int) {
                  if (ok) Achievements.add(this, if (save) "saves" else "loads", 1)
                  val msg = if (ok) (if (save) "Estado salvo no slot $slot" else "Estado do slot $slot carregado")
                            else (if (save) "Não foi possível salvar o estado" else "Não foi possível carregar o estado")
                  Toast.makeText(this, msg, Toast.LENGTH_SHORT).show()
                  closeMenu()
              }

              /** Miniatura do quadro atual (a superfície continua mostrando o último quadro enquanto pausada). */
              private fun captureThumb(slot: Int, done: () -> Unit) {
                  try { thumbFile(slot).delete() } catch (e: Throwable) {}
                  val sv = surfaceView
                  if (sv == null || sv.width <= 0 || sv.height <= 0) { done(); return }
                  try {
                      val w = 320
                      val h = (w * sv.height.toFloat() / sv.width).toInt().coerceAtLeast(1)
                      val bmp = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888)
                      PixelCopy.request(sv, bmp, { res ->
                          if (res == PixelCopy.SUCCESS) {
                              Thread {
                                  try { thumbFile(slot).outputStream().use { bmp.compress(Bitmap.CompressFormat.JPEG, 85, it) } } catch (e: Throwable) {}
                                  runOnUiThread { done() }
                              }.start()
                          } else {
                              done()
                          }
                      }, handler)
                  } catch (e: Throwable) {
                      done()
                  }
              }

              private fun doState(save: Boolean, slot: Int) {
                  Thread {
                      val ok = try {
                          if (save) NativeBridge.saveState(slot) else NativeBridge.loadState(slot)
                      } catch (e: Throwable) { false }
                      runOnUiThread {
                          if (ok && save) captureThumb(slot) { finishState(true, true, slot) }
                          else finishState(ok, save, slot)
                      }
                  }.start()
              }

              private val poll = object : Runnable {
                  override fun run() {
                      val st = NativeBridge.getStatus()
                      if (st.startsWith("ERRO")) {
                          showError(st)
                          return
                      }
                      ticks++
                      if (ticks < 60) handler.postDelayed(this, 500)
                  }
              }

              private val labelTick = object : Runnable {
                  override fun run() {
                      val l = roomLabel
                      if (l != null) {
                          if (mode == "host") {
                              val n = room?.playerCount ?: 1
                              l.text = if (roomError.isNotEmpty()) roomError
                              else "Sala ${RoomCode.pretty(roomCode)} · $n/${RoomProto.MAX_PLAYERS} jogadores"
                          } else {
                              l.text = guestStatus
                          }
                      }
                      handler.postDelayed(this, 500)
                  }
              }

              private fun showError(msg: String, title: String = "Não consegui abrir o jogo", diag: Boolean = true) {
                  if (errorShown || isFinishing) return
                  errorShown = true
                  AlertDialog.Builder(this)
                      .setTitle(title)
                      .setMessage(if (diag) msg + "\n\nAbra Config > Diagnóstico para ver o log e copiar." else msg)
                      .setCancelable(false)
                      .setPositiveButton("Fechar") { _, _ -> finish() }
                      .show()
              }

              private fun setRunning(v: Boolean) {
                  getSharedPreferences("n64emu", MODE_PRIVATE).edit().putBoolean("game_running", v).apply()
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  mode = intent.getStringExtra("mode") ?: ""
                  roomCode = intent.getStringExtra("code") ?: ""
                  system = intent.getStringExtra("system") ?: "n64"
                  val s = Settings(this)
                  val root = FrameLayout(this)
                  if (mode == "guest") {
                      // convidado: não roda o jogo, só mostra o vídeo que vem do dono da sala
                      val gv = GuestView(this)
                      guestView = gv
                      root.addView(gv)
                  } else {
                      val sv = SurfaceView(this)
                      surfaceView = sv
                      sv.holder.addCallback(this)
                      root.addView(sv)
                  }
                  val controls = ControlsView(this, system)
                  controls.alpha = s.controlsAlpha / 100f
                  controls.visibility = if (s.showControls) View.VISIBLE else View.GONE
                  root.addView(controls)

                  if (mode != "") {
                      val tv = TextView(this)
                      tv.setTextColor(Color.WHITE)
                      tv.setBackgroundColor(0x88000000.toInt())
                      tv.textSize = 12f
                      val p = Ui.dp(this, 6)
                      tv.setPadding(p * 2, p, p * 2, p)
                      roomLabel = tv
                      root.addView(tv, FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.WRAP_CONTENT,
                          FrameLayout.LayoutParams.WRAP_CONTENT,
                          Gravity.TOP or Gravity.CENTER_HORIZONTAL
                      ))
                  }
                  if (mode != "guest") {
                      // botão de menu (save states); também abre com o botão Voltar
                      val mb = TextView(this)
                      mb.text = "☰"
                      mb.setTextColor(Color.WHITE)
                      mb.textSize = 20f
                      mb.gravity = Gravity.CENTER
                      mb.alpha = 0.6f
                      mb.background = Ui.rounded(0x66000000, Ui.dp(this, 10))
                      mb.setOnClickListener { openMenu() }
                      val sz = Ui.dp(this, 40)
                      val lp = FrameLayout.LayoutParams(sz, sz, Gravity.TOP or Gravity.START)
                      lp.leftMargin = (resources.displayMetrics.widthPixels * 0.27f).toInt()
                      lp.topMargin = Ui.dp(this, 6)
                      root.addView(mb, lp)
                      // botão de avanço rápido (2x), ao lado do menu
                      val fb = TextView(this)
                      fb.text = "2x"
                      fb.setTextColor(Color.WHITE)
                      fb.textSize = 14f
                      fb.typeface = android.graphics.Typeface.DEFAULT_BOLD
                      fb.gravity = Gravity.CENTER
                      fb.alpha = 0.6f
                      fb.background = Ui.rounded(0x66000000, Ui.dp(this, 10))
                      fb.setOnClickListener { setFast(!fastOn) }
                      val flp = FrameLayout.LayoutParams(sz, sz, Gravity.TOP or Gravity.START)
                      flp.leftMargin = lp.leftMargin + sz + Ui.dp(this, 8)
                      flp.topMargin = Ui.dp(this, 6)
                      root.addView(fb, flp)
                      fastBtn = fb
                  }
                  onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) {
                      override fun handleOnBackPressed() {
                          if (mode == "guest" || !started) finish() else openMenu()
                      }
                  })
                  setContentView(root)

                  WindowCompat.setDecorFitsSystemWindows(window, false)
                  val ctl = WindowInsetsControllerCompat(window, root)
                  ctl.hide(WindowInsetsCompat.Type.systemBars())
                  ctl.systemBarsBehavior = WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE

                  if (mode == "guest") startGuest()
                  if (mode != "") handler.post(labelTick)
              }

              private fun setFast(on: Boolean) {
                  fastOn = on
                  try { NativeBridge.setFastForward(on) } catch (e: Throwable) {}
                  fastBtn?.let {
                      it.alpha = if (on) 1f else 0.6f
                      it.background = Ui.rounded(if (on) Ui.ACCENT else 0x66000000, Ui.dp(this, 10))
                  }
              }

              private fun extraUris(): List<Uri> =
                  (intent.getStringArrayListExtra("extras") ?: ArrayList<String>()).map { Uri.parse(it) }

              private fun startGuest() {
                  val uri = intent.data
                  val ip = RoomCode.decode(roomCode)
                  if (uri == null || ip == null) {
                      showError("Código de sala inválido.", "Sala", false)
                      return
                  }
                  val c = RoomClient(ip, object : RoomClient.Listener {
                      override fun onJoined(slot: Int) {
                          Achievements.add(this@EmulatorActivity, "rooms_guest", 1)
                          guestStatus = "Jogador ${slot + 1} · sala ${RoomCode.pretty(roomCode)}"
                      }

                      override fun onFrame(bmp: Bitmap, aspect: Float) {
                          guestView?.show(bmp, aspect)
                      }

                      override fun onClosed(reason: String) {
                          runOnUiThread { showError(reason, "Sala", false) }
                      }
                  })
                  client = c
                  Input.remote = c
                  Thread {
                      try {
                          val hash: Int? = if (system != "n64") RomHash.ofPs1(this, uri, extraUris()) else contentResolver.openInputStream(uri)?.use { RomHash.of(it) }
                          if (hash == null) {
                              runOnUiThread { showError("Não consegui ler a ROM escolhida.", "Sala", false) }
                              return@Thread
                          }
                          c.start(hash)
                      } catch (e: Throwable) {
                          runOnUiThread { showError("Não consegui ler a ROM escolhida: " + (e.message ?: ""), "Sala", false) }
                      }
                  }.start()
              }

              override fun surfaceCreated(h: SurfaceHolder) {
                  if (started) return
                  started = true
                  val uri = intent.data
                  if (uri == null) {
                      showError("ERRO: nenhuma ROM foi informada.")
                      return
                  }
                  val surface = h.surface
                  Thread {
                      try {
                          val s = Settings(this)
                          val isPs1 = system == "ps1"
                          val isPsp = system == "psp"
                          val isDisc = isPs1 || isPsp  // PS1 e PSP: o núcleo abre o arquivo do disco direto
                          var rom: File
                          if (isDisc) {
                              // PS1: o disco é grande, então o app liga direto ao arquivo original (e só copia se não der)
                              for (p in pfds) { try { p.close() } catch (e: Exception) { } }
                              pfds.clear()
                              rom = Ps1Files.prepare(this, uri, extraUris(), pfds)
                          } else {
                              rom = File(cacheDir, "rom.z64")
                              val ins = contentResolver.openInputStream(uri)
                              if (ins == null) {
                                  runOnUiThread { showError("ERRO: não consegui abrir o arquivo da ROM (permissão perdida?). Remova e adicione a ROM de novo.") }
                                  return@Thread
                              }
                              ins.use { i -> FileOutputStream(rom).use { o -> i.copyTo(o) } }
                          }

                          val gameId = intent.getStringExtra("game_id") ?: ""
                          if (gameId.isNotBlank() && !isPsp && !(isPs1 && extraUris().isNotEmpty())) {
                              try {
                                  rom = ModManager.applyEnabledPatches(this, gameId, rom)
                              } catch (patchError: Throwable) {
                                  runOnUiThread { Toast.makeText(this, "Mod não aplicado: ${patchError.message}", Toast.LENGTH_LONG).show() }
                              }
                          }

                          val sys = Storage.systemDir(this)
                          Storage.hiresDir(this)
                          File(sys, "hires_texture").mkdirs()
                          val saves = Storage.savesDir(this)
                          if (system == "nds") File(sys, "melonDS DS").mkdirs()

                          saveName = (intent.getStringExtra("title") ?: "game").replace(Regex("[/\\\\:*?\"<>|]"), "_")
                          NativeBridge.init(
                              applicationInfo.nativeLibraryDir + "/" + (if (isPs1) "libpsx_core.so" else if (isPsp) "libppsspp_core.so" else if (system == "nds") "libmelonds_core.so" else "libmupen_core.so"),
                              sys.absolutePath,
                              saves.absolutePath,
                              Storage.logFile(this).absolutePath,
                              saveName
                          )
                          if (system == "n64") {
                              NativeBridge.setOption("mupen64plus-aspect", s.aspect)
                              NativeBridge.setOption("mupen64plus-EnableNativeResFactor", s.resolutionFactor.coerceIn(1, 8).toString())
                              val textureOn = s.texturePacks && ModManager.textureEnabled(this, intent.getStringExtra("game_id") ?: "")
                              NativeBridge.setOption("mupen64plus-txHiresEnable", if (textureOn) "True" else "False")
                              NativeBridge.setOption("mupen64plus-txHiresFullAlphaChannel", if (textureOn) "True" else "False")
                          } else if (isPsp) {
                              // PPSSPP: copia fontes/atlas do PSP para a pasta system (só na primeira vez)
                              PspAssets.ensure(this, sys)
                          } else {
                              // O PCSX ReARMed escolhe o tipo de controle por opção do núcleo (padrão: standard = sem analógicos).
                              // DualShock = 2 analógicos + L3/R3.
                              NativeBridge.setOption("pcsx_rearmed_pad1type", "dualshock")
                              if (mode == "host") {
                                  NativeBridge.setOption("muntdroid_ports", "4")
                                  for (n in 2..4) NativeBridge.setOption("pcsx_rearmed_pad" + n + "type", "dualshock")
                              }
                          }
                          val hash = if (mode != "host") 0 else if (isDisc) RomHash.ofPs1(this, uri, extraUris()) else RomHash.of(rom)
                          setRunning(true)
                          NativeBridge.start(rom.absolutePath, surface)
                          NativeBridge.setFastForward(fastOn)
                          handler.post(poll)
                          Achievements.gameStarted(this, intent.getStringExtra("title") ?: "game", system)

                          if (mode == "host") {
                              val r = RoomHost(hash)
                              if (r.start()) {
                                  room = r
                                  Achievements.add(this, "rooms_host", 1)
                              } else {
                                  roomError = "Não consegui abrir a sala (porta ${RoomProto.PORT} em uso). Feche o app e tente de novo."
                              }
                          }
                      } catch (e: Throwable) {
                          runOnUiThread { showError("ERRO: " + e.javaClass.simpleName + " - " + (e.message ?: "")) }
                      }
                  }.start()
              }

              override fun surfaceChanged(h: SurfaceHolder, f: Int, w: Int, hh: Int) {}

              override fun surfaceDestroyed(h: SurfaceHolder) {
                  handler.removeCallbacks(poll)
                  try {
                      room?.stop()
                  } catch (e: Throwable) {
                  }
                  room = null
                  try {
                      NativeBridge.stop()
                  } catch (e: Throwable) {
                  }
                  setRunning(false)
                  started = false
              }

              override fun onDestroy() {
                  handler.removeCallbacks(labelTick)
                  Input.remote = null
                  try { client?.stop() } catch (e: Throwable) { }
                  try { room?.stop() } catch (e: Throwable) { }
                  for (p in pfds) { try { p.close() } catch (e: Exception) { } }
                  super.onDestroy()
              }

              override fun onPause() {
                  super.onPause()
                  if (resumedAt > 0L && started && mode != "guest") {
                      Achievements.addPlaySeconds(this, (System.currentTimeMillis() - resumedAt) / 1000L)
                  }
                  resumedAt = 0L
                  if (mode != "guest") {
                      try { NativeBridge.pause() } catch (e: Throwable) {}
                  }
              }

              override fun onResume() {
                  super.onResume()
                  resumedAt = System.currentTimeMillis()
                  if (mode != "guest" && !menuOpen) {
                      try { NativeBridge.resume() } catch (e: Throwable) {}
                  }
              }
          }
