          package dev.n64emu.app

          import android.content.Context
          import android.net.Uri
          import android.provider.OpenableColumns

          object Rom {
              /** Extensões reconhecidas como jogos de PlayStation. */
              val PS1_EXT = setOf("cue", "bin", "iso", "img", "chd", "pbp")

              /** Extensões que só existem no PSP. */
              val PSP_EXT = setOf("cso", "elf", "prx")
              val NDS_EXT = setOf("nds", "dsi", "ids")

              /** Console do arquivo. ISO e PBP servem para PS1 e PSP, então o app olha dentro do arquivo. */
              fun systemOf(ctx: Context, uri: Uri, fileName: String): String {
                  val ext = fileName.substringAfterLast('.', "").lowercase()
                  if (ext in NDS_EXT) return "nds"
                  if (ext in PSP_EXT) return "psp"
                  if (ext == "iso" && isPspIso(ctx, uri)) return "psp"
                  if (ext == "pbp" && isPspPbp(ctx, uri)) return "psp"
                  return if (ext in PS1_EXT) "ps1" else "n64"
              }

              /** ISO de PSP tem a pasta PSP_GAME logo no começo do disco. */
              private fun isPspIso(ctx: Context, uri: Uri): Boolean {
                  try {
                      ctx.contentResolver.openInputStream(uri)?.use { ins ->
                          val b = ByteArray(1 shl 20)
                          var n = 0
                          while (n < b.size) {
                              val r = ins.read(b, n, b.size - n)
                              if (r < 0) break
                              n += r
                          }
                          val key = "PSP_GAME".toByteArray(Charsets.US_ASCII)
                          var i = 0
                          while (i <= n - key.size) {
                              var k = 0
                              while (k < key.size && b[i + k] == key[k]) k++
                              if (k == key.size) return true
                              i++
                          }
                      }
                  } catch (e: Exception) {
                  }
                  return false
              }

              /** EBOOT.PBP: se o pacote de dados for "PSISOIMG" é PS1; qualquer outro (ou sem dados) é PSP. */
              private fun isPspPbp(ctx: Context, uri: Uri): Boolean {
                  try {
                      ctx.contentResolver.openInputStream(uri)?.use { ins ->
                          val h = ByteArray(40)
                          var n = 0
                          while (n < h.size) {
                              val r = ins.read(h, n, h.size - n)
                              if (r < 0) return false
                              n += r
                          }
                          if (h[1] != 'P'.code.toByte() || h[2] != 'B'.code.toByte() || h[3] != 'P'.code.toByte()) return false
                          val psar = (h[36].toLong() and 0xFF) or ((h[37].toLong() and 0xFF) shl 8) or
                              ((h[38].toLong() and 0xFF) shl 16) or ((h[39].toLong() and 0xFF) shl 24)
                          var left = psar - 40L
                          if (left < 0L) return true
                          while (left > 0L) {
                              val sk = ins.skip(left)
                              if (sk > 0L) left -= sk else {
                                  if (ins.read() < 0) return true
                                  left--
                              }
                          }
                          val m = ByteArray(8)
                          var got = 0
                          while (got < m.size) {
                              val r = ins.read(m, got, m.size - got)
                              if (r < 0) break
                              got += r
                          }
                          if (got < m.size) return true
                          return String(m, Charsets.US_ASCII) != "PSISOIMG"
                      }
                  } catch (e: Exception) {
                  }
                  return false
              }

              /** Nomes dos arquivos (.bin) citados dentro de um .cue, na ordem. */
              fun cueFiles(ctx: Context, uri: Uri): List<String> {
                  val out = ArrayList<String>()
                  try {
                      val text = ctx.contentResolver.openInputStream(uri)?.use { ins ->
                          val b = ByteArray(65536)
                          var n = 0
                          while (n < b.size) {
                              val r = ins.read(b, n, b.size - n)
                              if (r < 0) break
                              n += r
                          }
                          String(b, 0, n, Charsets.UTF_8)
                      } ?: return out
                      val rx = Regex("""FILE\s+(?:"([^"]+)"|(\S+))""", RegexOption.IGNORE_CASE)
                      for (m in rx.findAll(text)) {
                          val raw = m.groupValues[1].ifEmpty { m.groupValues[2] }
                          out.add(raw.substringAfterLast('/').substringAfterLast('\\'))
                      }
                  } catch (e: Exception) {
                  }
                  return out
              }
              fun displayName(ctx: Context, uri: Uri): String {
                  var name: String? = null
                  try {
                      val c = ctx.contentResolver.query(uri, arrayOf(OpenableColumns.DISPLAY_NAME), null, null, null)
                      if (c != null) {
                          if (c.moveToFirst()) name = c.getString(0)
                          c.close()
                      }
                  } catch (e: Exception) {
                  }
                  val n = name ?: uri.lastPathSegment ?: "ROM"
                  return n.substringBeforeLast('.')
              }

              /** Nome interno do cabeçalho da ROM (usado como nome da pasta de texturas HD). */
              fun internalName(ctx: Context, uri: Uri): String {
                  try {
                      val buf = ByteArray(0x40)
                      val ins = ctx.contentResolver.openInputStream(uri) ?: return ""
                      var off = 0
                      ins.use {
                          while (off < buf.size) {
                              val r = it.read(buf, off, buf.size - off)
                              if (r < 0) break
                              off += r
                          }
                      }
                      val sw = ByteArray(0x40)
                      when (buf[0].toInt() and 0xFF) {
                          0x80 -> System.arraycopy(buf, 0, sw, 0, 0x40)
                          0x37 -> {
                              var i = 0
                              while (i < 0x40) { sw[i] = buf[i + 1]; sw[i + 1] = buf[i]; i += 2 }
                          }
                          0x40 -> {
                              var i = 0
                              while (i < 0x40) { sw[i] = buf[i + 3]; sw[i + 1] = buf[i + 2]; sw[i + 2] = buf[i + 1]; sw[i + 3] = buf[i]; i += 4 }
                          }
                          else -> return ""
                      }
                      return String(sw, 0x20, 20, Charsets.US_ASCII).trim { it <= ' ' || it == '\u0000' }
                  } catch (e: Exception) {
                      return ""
                  }
              }
          }
