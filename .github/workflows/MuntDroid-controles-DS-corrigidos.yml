                  diag.addView(Ui.text(act, "Diagnóstico", 18f, bold = true))
                  diag.addView(Ui.text(act, "Se um jogo não abrir ou fechar sozinho, veja o log e copie para me mandar.", 13f, Ui.SUB))
                  diag.addView(Ui.button(act, "Ver último log") { showLog() })
                  col.addView(diag)

                  col.addView(Ui.text(act, "As mudanças valem na próxima vez que você abrir um jogo.", 13f, Ui.SUB))
                  view.addView(col)
              }
