          class GamesTab(private val act: MainActivity) {
              val view = FrameLayout(act)
              private val grid = GridLayout(act)
              private val empty: TextView
              private lateinit var coversBtn: Button
              private var coversBusy = false

              private fun dp(v: Int) = Ui.dp(act, v)

              init {
                  val col = LinearLayout(act)
                  col.orientation = LinearLayout.VERTICAL
                  col.setPadding(dp(12), dp(12), dp(12), dp(96))
                  val head = LinearLayout(act)
                  head.orientation = LinearLayout.HORIZONTAL
                  head.gravity = Gravity.CENTER_VERTICAL
                  head.addView(Ui.text(act, "Jogos", 26f, bold = true), LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))
                  coversBtn = Ui.button(act, "🖼 Buscar capas") { fetchAllCovers() }
                  head.addView(coversBtn)
                  col.addView(head)
                  empty = Ui.text(act, "Nenhum jogo ainda.\nToque em \"＋ Adicionar ROM\" para começar.", 15f, Ui.SUB)
                  empty.setPadding(0, dp(24), 0, dp(24))
                  col.addView(empty)
                  col.addView(grid)
                  val scroll = ScrollView(act)
                  scroll.addView(col)
