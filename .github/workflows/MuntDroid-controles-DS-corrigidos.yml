          class ModsTab(private val act: MainActivity) {
              val view = ScrollView(act)
              private val col = LinearLayout(act)
              private fun dp(v: Int) = Ui.dp(act, v)

              init {
                  col.orientation = LinearLayout.VERTICAL
                  col.setPadding(dp(12), dp(12), dp(12), dp(12))
                  view.addView(col)
              }

              fun refresh() {
                  col.removeAllViews()
                  col.addView(Ui.text(act, "Mods por jogo", 26f, bold = true))
                  col.addView(Ui.text(act, "Cada jogo guarda seus próprios mods. Desative um mod sem afetar os outros jogos.", 13f, Ui.SUB))
                  col.addView(Ui.button(act, "＋ Importar patch (.IPS / .BPS)") { act.pickPatch.launch(arrayOf("*/*")) })
                  col.addView(Ui.button(act, "＋ Importar texturas HD (.ZIP)") { act.pickZip.launch(arrayOf("*/*")) })
                  if (act.library.games.isEmpty()) {
                      col.addView(Ui.text(act, "Adicione jogos primeiro para configurar os mods.", 14f, Ui.SUB))
                  }
                  for (g in act.library.games) {
                      val card = Ui.card(act)
                      card.addView(Ui.text(act, g.title + when (g.system) { "ps1" -> " · PlayStation"; "psp" -> " · PSP"; else -> " · Nintendo 64" }, 17f, bold = true))
                      val textureDir = ModManager.textureDir(act, g)
                      val hasTextures = textureDir.exists() && (textureDir.walkTopDown().any { it.isFile })
                      if (g.system == "n64") {
                          val sw = Switch(act)
                          sw.text = "Texturas HD"
                          sw.isChecked = ModManager.textureEnabled(act, g.id)
                          sw.isEnabled = hasTextures
                          sw.setOnCheckedChangeListener { _, checked -> ModManager.setTextureEnabled(act, g.id, checked) }
                          card.addView(sw)
                          card.addView(Ui.text(act, if (hasTextures) "${textureDir.walkTopDown().count { it.isFile }} arquivos instalados" else "Nenhum pacote de texturas para este jogo.", 12f, Ui.SUB))
                      }
                      if (g.system == "psp") {
                          card.addView(Ui.text(act, "Mods e patches ainda não estão disponíveis para PSP.", 12f, Ui.SUB))
                          col.addView(card)
                          continue
                      }
                      val patches = ModManager.patches(act, g.id)
                      if (patches.isEmpty()) card.addView(Ui.text(act, "Nenhum patch instalado.", 12f, Ui.SUB))
                      for (patch in patches) {
                          val sw = Switch(act)
                          sw.text = patch.name
                          sw.isChecked = patch.enabled
                          sw.setOnCheckedChangeListener { _, checked -> ModManager.setPatchEnabled(act, g.id, patch.file, checked) }
                          card.addView(sw)
                          card.addView(Ui.text(act, patch.file.substringAfterLast('.').uppercase() + " · aplicado ao iniciar o jogo", 11f, Ui.SUB))
                      }
                      card.addView(Ui.button(act, "Importar patch para este jogo") {
                          ModManager.pendingGameId = g.id
                          act.pickPatch.launch(arrayOf("*/*"))
                      })
                      col.addView(card)
                  }
              }

              fun onPatchPicked(uri: Uri) {
                  val id = ModManager.pendingGameId ?: run {
                      val games = act.library.games
                      if (games.isEmpty()) { Toast.makeText(act, "Adicione um jogo primeiro.", Toast.LENGTH_LONG).show(); return }
                      AlertDialog.Builder(act).setTitle("Aplicar patch em qual jogo?")
                          .setItems(games.map { it.title }.toTypedArray()) { _, i -> importPatch(uri, games[i]) }.show()
                      return
                  }
                  ModManager.pendingGameId = null
                  val game = act.library.find(id) ?: return
                  importPatch(uri, game)
              }

              private fun importPatch(uri: Uri, game: Game) {
                  val name = Ps1Files.fileName(act, uri)
                  val ext = name.substringAfterLast('.', "").lowercase()
                  if (ext !in setOf("ips", "bps")) {
                      Toast.makeText(act, "Formato não suportado. Use .IPS ou .BPS.", Toast.LENGTH_LONG).show()
                      return
                  }
                  try {
                      val dir = ModManager.patchDir(act, game.id).apply { mkdirs() }
                      val out = File(dir, name.replace(Regex("[^A-Za-z0-9._-]"), "_"))
                      act.contentResolver.openInputStream(uri)?.use { input -> out.outputStream().use { input.copyTo(it) } }
                          ?: throw IllegalStateException("Não foi possível ler o patch")
                      ModManager.addPatch(act, game.id, out)
                      Toast.makeText(act, "Patch importado. Ative a chave ao lado do nome para usá-lo.", Toast.LENGTH_LONG).show()
                      refresh()
                  } catch (e: Exception) {
                      Toast.makeText(act, "Falha ao importar: ${e.message}", Toast.LENGTH_LONG).show()
                  }
              }

              fun onZipPicked(uri: Uri) {
                  val list = act.library.games.filter { it.system == "n64" }
                  if (list.isEmpty()) { Toast.makeText(act, "Adicione um jogo de Nintendo 64 primeiro.", Toast.LENGTH_LONG).show(); return }
                  AlertDialog.Builder(act).setTitle("Pacote de texturas para qual jogo?")
                      .setItems(list.map { it.title }.toTypedArray()) { _, i ->
                          val g = list[i]
                          Toast.makeText(act, "Importando texturas…", Toast.LENGTH_SHORT).show()
                          Thread {
                              val n = try { extract(uri, ModManager.textureDir(act, g)) } catch (e: Exception) { -1 }
                              act.runOnUiThread {
                                  if (n > 0) {
                                      ModManager.setTextureEnabled(act, g.id, true)
                                      Achievements.add(act, "packs", 1)
                                  }
                                  Toast.makeText(act, if (n > 0) "$n arquivos importados para ${g.title}." else "Falha ou ZIP sem arquivos.", Toast.LENGTH_LONG).show()
                                  refresh()
                              }
                          }.start()
                      }.show()
              }

              private fun extract(uri: Uri, dest: File): Int {
                  dest.mkdirs()
                  val base = dest.canonicalPath + File.separator
                  var count = 0
                  val input = act.contentResolver.openInputStream(uri) ?: return -1
                  ZipInputStream(input).use { z ->
                      var e = z.nextEntry
                      while (e != null) {
                          val n = e.name.replace('\\', '/')
                          if (!e.isDirectory && !n.startsWith("/") && !n.split('/').contains("..") && !n.startsWith("__MACOSX")) {
                              val out = File(dest, n)
                              if (out.canonicalPath.startsWith(base)) {
                                  out.parentFile?.mkdirs()
                                  out.outputStream().use { z.copyTo(it) }
                                  count++
                              }
                          }
                          e = z.nextEntry
                      }
                  }
                  return count
              }
          }
