          package dev.n64emu.app

          import android.content.res.ColorStateList
          import android.view.Gravity
          import android.widget.LinearLayout
          import android.widget.ProgressBar
          import android.widget.ScrollView
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          class AchievementsTab(private val act: MainActivity) {
              val view = ScrollView(act)
              private val col = LinearLayout(act)

              private fun dp(v: Int) = Ui.dp(act, v)

              init {
                  col.orientation = LinearLayout.VERTICAL
                  col.setPadding(dp(12), dp(12), dp(12), dp(12))
                  view.addView(col)
              }

              private fun bar(max: Int, progress: Int): ProgressBar {
                  val b = ProgressBar(act, null, android.R.attr.progressBarStyleHorizontal)
                  b.max = max
                  b.progress = progress
                  b.progressTintList = ColorStateList.valueOf(Ui.ACCENT)
                  return b
              }

              fun refresh() {
                  col.removeAllViews()
                  col.addView(Ui.text(act, "Conquistas", 26f, bold = true))

                  val total = Achievements.all.size
                  val done = Achievements.count(act)
                  val head = Ui.card(act)
                  head.addView(Ui.text(act, "$done de $total desbloqueadas", 18f, bold = true))
                  head.addView(Ui.text(act, "Pontos: " + Achievements.points(act) + " de " + Achievements.totalPoints, 14f, Ui.SUB))
                  val mins = Achievements.playSeconds(act) / 60L
                  head.addView(Ui.text(act, "Tempo jogado: " + (mins / 60L) + "h " + (mins % 60L) + "min", 14f, Ui.SUB))
                  head.addView(bar(total, done))
                  col.addView(head)

                  val fmt = SimpleDateFormat("dd/MM/yyyy", Locale.getDefault())
                  for (a in Achievements.all) {
                      val got = Achievements.unlockedAt(act, a.id)
                      val card = Ui.card(act)
                      card.alpha = if (got > 0L) 1f else 0.6f

                      val row = LinearLayout(act)
                      row.orientation = LinearLayout.HORIZONTAL
                      row.gravity = Gravity.CENTER_VERTICAL

                      val icon = Ui.text(act, a.icon, 28f)
                      icon.gravity = Gravity.CENTER
                      row.addView(icon, LinearLayout.LayoutParams(dp(48), LinearLayout.LayoutParams.WRAP_CONTENT))

                      val info = LinearLayout(act)
                      info.orientation = LinearLayout.VERTICAL
                      info.addView(Ui.text(act, a.title + "  ·  " + a.points + " pts", 16f, bold = true))
                      info.addView(Ui.text(act, a.desc, 13f, Ui.SUB))
                      if (got > 0L) {
                          info.addView(Ui.text(act, "✅ Desbloqueada em " + fmt.format(Date(got)), 12f, 0xFF4ADE80.toInt()))
                      } else if (a.goal > 1) {
                          val cur = minOf(Achievements.value(act, a.counter), a.goal)
                          info.addView(Ui.text(act, "Progresso: " + cur + "/" + a.goal, 12f, Ui.SUB))
                          info.addView(bar(a.goal, cur))
                      } else {
                          info.addView(Ui.text(act, "🔒 Bloqueada", 12f, Ui.SUB))
                      }
                      row.addView(info, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))

                      card.addView(row)
                      col.addView(card)
                  }
              }
          }
