          package dev.n64emu.app

          import android.content.Context
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView

          object Ui {
              val BG = 0xFF101018.toInt()
              val CARD = 0xFF1C1C28.toInt()
              val ACCENT = 0xFF8B5CF6.toInt()
              val TEXT = 0xFFFFFFFF.toInt()
              val SUB = 0xFFA0A0B0.toInt()

              fun dp(ctx: Context, v: Int): Int = (v * ctx.resources.displayMetrics.density).toInt()

              fun rounded(color: Int, radius: Int): GradientDrawable {
                  val d = GradientDrawable()
                  d.setColor(color)
                  d.cornerRadius = radius.toFloat()
                  return d
              }

              fun text(ctx: Context, s: String, size: Float = 16f, color: Int = TEXT, bold: Boolean = false): TextView {
                  val t = TextView(ctx)
                  t.text = s
                  t.textSize = size
                  t.setTextColor(color)
                  if (bold) t.setTypeface(t.typeface, Typeface.BOLD)
                  return t
              }

              fun button(ctx: Context, s: String, onClick: () -> Unit): Button {
                  val b = Button(ctx)
                  b.text = s
                  b.setTextColor(TEXT)
                  b.setAllCaps(false)
                  b.background = rounded(ACCENT, dp(ctx, 10))
                  b.setOnClickListener { onClick() }
                  return b
              }

              fun card(ctx: Context): LinearLayout {
                  val c = LinearLayout(ctx)
                  c.orientation = LinearLayout.VERTICAL
                  c.background = rounded(CARD, dp(ctx, 14))
                  val p = dp(ctx, 14)
                  c.setPadding(p, p, p, p)
                  val lp = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT)
                  lp.bottomMargin = dp(ctx, 12)
                  c.layoutParams = lp
                  return c
              }
          }
