          class SettingsTab(private val act: MainActivity) {
              val view = ScrollView(act)

              private fun tint(s: SeekBar) {
                  s.progressTintList = ColorStateList.valueOf(Ui.ACCENT)
                  s.thumbTintList = ColorStateList.valueOf(Ui.ACCENT)
              }

              private fun seek(max: Int, progress: Int, onChange: (Int) -> Unit): SeekBar {
                  val s = SeekBar(act)
                  s.max = max
                  s.progress = progress
                  tint(s)
                  s.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(sb: SeekBar?, v: Int, fromUser: Boolean) { onChange(v) }
                      override fun onStartTrackingTouch(sb: SeekBar?) {}
                      override fun onStopTrackingTouch(sb: SeekBar?) {}
                  })
                  return s
              }

              private fun toggle(label: String, on: Boolean, onChange: (Boolean) -> Unit): SwitchCompat {
                  val sw = SwitchCompat(act)
                  sw.text = label
                  sw.setTextColor(Ui.TEXT)
                  sw.isChecked = on
                  sw.setOnCheckedChangeListener { _, c -> onChange(c) }
                  return sw
              }

              private fun showLog() {
                  val f = Storage.logFile(act)
                  val txt = if (f.exists()) f.readText().takeLast(8000) else "Nenhum log ainda. Abra um jogo primeiro."
                  val tv = TextView(act)
                  tv.text = txt
                  tv.textSize = 11f
                  tv.setTextIsSelectable(true)
                  val p = Ui.dp(act, 12)
                  tv.setPadding(p, p, p, p)
                  val sc = ScrollView(act)
                  sc.addView(tv)
                  AlertDialog.Builder(act)
                      .setTitle("Último log")
                      .setView(sc)
                      .setPositiveButton("Copiar") { _, _ ->
                          val cm = act.getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                          cm.setPrimaryClip(ClipData.newPlainText("log", txt))
                          Toast.makeText(act, "Log copiado.", Toast.LENGTH_SHORT).show()
                      }
                      .setNegativeButton("Fechar", null)
                      .show()
              }

              init {
                  val s = act.settings
                  val col = LinearLayout(act)
                  col.orientation = LinearLayout.VERTICAL
                  val pad = Ui.dp(act, 12)
                  col.setPadding(pad, pad, pad, pad)
                  col.addView(Ui.text(act, "Configuração do jogo", 26f, bold = true))

                  val video = Ui.card(act)
                  video.addView(Ui.text(act, "Vídeo", 18f, bold = true))
                  val resLabel = Ui.text(act, "Resolução interna: ${s.resolutionFactor}x", 15f)
                  video.addView(resLabel)
                  video.addView(seek(9, s.resolutionFactor - 1) { v ->
                      s.resolutionFactor = v + 1
                      Achievements.raise(act, "res", v + 1)
                      resLabel.text = "Resolução interna: ${v + 1}x"
                  })
                  video.addView(Ui.text(act, "Acima de 4x pode travar em celulares mais fracos.", 12f, Ui.SUB))
                  val ptxt = Ui.text(act, "Proporção da tela", 15f)
                  ptxt.setPadding(0, Ui.dp(act, 10), 0, 0)
                  video.addView(ptxt)
                  val options = listOf(
                      Pair("4:3", "4:3"),
                      Pair("16:9 (ajustado)", "16:9 adjusted"),
                      Pair("16:9 (esticado)", "16:9")
                  )
                  val group = RadioGroup(act)
                  for (o in options) {
                      val rb = RadioButton(act)
                      rb.id = View.generateViewId()
                      rb.text = o.first
                      rb.setTextColor(Ui.TEXT)
                      rb.isChecked = s.aspect == o.second
                      rb.setOnClickListener { s.aspect = o.second }
                      group.addView(rb)
                  }
                  video.addView(group)
                  col.addView(video)

                  val tex = Ui.card(act)
                  tex.addView(Ui.text(act, "Texturas e mods", 18f, bold = true))
                  tex.addView(toggle("Texturas HD / mods", s.texturePacks) { s.texturePacks = it })
                  col.addView(tex)

