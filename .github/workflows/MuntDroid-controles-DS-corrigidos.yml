              fun value(ctx: Context, name: String): Int = prefs(ctx).getInt("c_" + name, 0)
              fun unlockedAt(ctx: Context, id: String): Long = prefs(ctx).getLong("u_" + id, 0L)
              fun isUnlocked(ctx: Context, id: String): Boolean = unlockedAt(ctx, id) > 0L
              fun count(ctx: Context): Int = all.count { isUnlocked(ctx, it.id) }
              fun points(ctx: Context): Int = all.filter { isUnlocked(ctx, it.id) }.sumOf { it.points }
              val totalPoints: Int get() = all.sumOf { it.points }
              fun playSeconds(ctx: Context): Long = prefs(ctx).getLong("play_sec", 0L)

              /** Soma [amount] ao contador [name] e libera as conquistas que chegaram na meta. */
              @Synchronized
              fun add(ctx: Context, name: String, amount: Int = 1) {
                  raise(ctx, name, value(ctx, name) + amount)
              }

              /** Sobe o contador [name] para [v] (nunca diminui) e libera as conquistas que chegaram na meta. */
              @Synchronized
              fun raise(ctx: Context, name: String, v: Int) {
                  val p = prefs(ctx)
                  if (v > p.getInt("c_" + name, 0)) p.edit().putInt("c_" + name, v).apply()
                  val now = p.getInt("c_" + name, 0)
                  for (a in all) {
                      if (a.counter != name || isUnlocked(ctx, a.id)) continue
                      if (now >= a.goal) unlock(ctx, a)
                  }
              }

              private fun unlock(ctx: Context, a: Achievement) {
                  prefs(ctx).edit().putLong("u_" + a.id, System.currentTimeMillis()).apply()
                  val app = ctx.applicationContext
                  main.post {
                      Toast.makeText(app, "🏆 Conquista desbloqueada: " + a.title + " (+" + a.points + " pts)", Toast.LENGTH_LONG).show()
                  }
                  if (a.id != "platinum") {
                      val others = all.count { it.id != "platinum" && isUnlocked(ctx, it.id) }
                      raise(ctx, "unlocked_others", others)
                  }
              }

              /** Chamado quando um jogo abre: conta aberturas, jogos diferentes, consoles e dias jogados. */
              fun gameStarted(ctx: Context, title: String, system: String) {
                  val p = prefs(ctx)
                  add(ctx, "plays", 1)
                  val t = title.lowercase().replace(Regex("[^a-z0-9]"), "")
                  val specific = when {
                      t.contains("supermario64") -> "game_sm64"
                      t.contains("ocarinaoftime") -> "game_oot"
                      t.contains("mariokart64") -> "game_mk64"
                      t.contains("goldeneye007") || t == "goldeneye" -> "game_goldeneye"
                      t.contains("supersmashbros") -> "game_smash64"
                      t.contains("crashbandicoot") -> "game_crash"
                      t.contains("tekken3") -> "game_tekken3"
                      t.contains("residentevil2") || t.contains("biohazard2") -> "game_re2"
                      t.contains("finalfantasyvii") || t.contains("finalfantasy7") -> "game_ff7"
                      t.contains("granturismo2") -> "game_gt2"
                      else -> null
                  }
                  if (specific != null) add(ctx, specific, 1)
                  val games = HashSet<String>(p.getStringSet("played", null) ?: emptySet<String>())
                  games.add(title)
                  p.edit().putStringSet("played", games).apply()
                  raise(ctx, "unique", games.size)
                  val systems = HashSet<String>(p.getStringSet("systems", null) ?: emptySet<String>())
                  systems.add(system)
                  p.edit().putStringSet("systems", systems).apply()
                  raise(ctx, "systems", systems.size)
                  val day = SimpleDateFormat("yyyy-MM-dd", Locale.US).format(Date())
                  if (p.getString("last_day", "") != day) {
                      p.edit().putString("last_day", day).apply()
                      add(ctx, "days", 1)
                  }
              }

              /** Soma o tempo jogado (em segundos) e atualiza o contador em minutos. */
              fun addPlaySeconds(ctx: Context, sec: Long) {
                  if (sec <= 0L) return
                  val p = prefs(ctx)
                  val total = p.getLong("play_sec", 0L) + sec
                  p.edit().putLong("play_sec", total).apply()
                  raise(ctx, "playtime_min", (total / 60L).toInt())
              }
          }
