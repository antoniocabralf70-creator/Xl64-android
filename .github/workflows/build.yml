          package dev.n64emu.app

          import android.content.Context
          import android.net.Uri
          import android.os.ParcelFileDescriptor
          import android.provider.OpenableColumns
          import android.system.Os
          import android.system.OsConstants
          import java.io.File
          import java.io.FileInputStream
          import java.io.FileOutputStream
          import java.io.IOException

          /**
           * Prepara os arquivos de um jogo de PS1 numa pasta temporária, com os nomes originais
           * (o .cue aponta para os .bin pelo nome). O núcleo de PS1 precisa de um caminho de arquivo.
           * Primeiro tenta um atalho (symlink) para o arquivo original, sem copiar centenas de MB;
           * se o Android não deixar, copia.
           */
          object Ps1Files {
              fun fileName(ctx: Context, uri: Uri): String {
                  var name: String? = null
                  try {
                      val c = ctx.contentResolver.query(uri, arrayOf(OpenableColumns.DISPLAY_NAME), null, null, null)
                      if (c != null) {
                          if (c.moveToFirst()) name = c.getString(0)
                          c.close()
                      }
                  } catch (e: Exception) {
                  }
                  return (name ?: uri.lastPathSegment ?: "disc.bin").replace(Regex("[/\\\\:*?\"<>|]"), "_")
              }

              /** Devolve o arquivo principal. Os descritores abertos ficam em [keep] e devem ser fechados ao sair. */
              fun prepare(ctx: Context, main: Uri, extras: List<Uri>, keep: MutableList<ParcelFileDescriptor>): File {
                  val dir = File(ctx.cacheDir, "ps1")
                  dir.mkdirs()
                  dir.listFiles()?.forEach { it.delete() }
                  val result = place(ctx, main, dir, keep)
                  for (u in extras) place(ctx, u, dir, keep)
                  return result
              }

              private fun place(ctx: Context, uri: Uri, dir: File, keep: MutableList<ParcelFileDescriptor>): File {
                  val out = File(dir, fileName(ctx, uri))
                  var opened: ParcelFileDescriptor? = null
                  try {
                      val pfd = ctx.contentResolver.openFileDescriptor(uri, "r")
                      opened = pfd
                      if (pfd != null) {
                          val fd = pfd.fileDescriptor
                          val st = Os.fstat(fd)
                          if (OsConstants.S_ISREG(st.st_mode)) {
                              Os.lseek(fd, 0L, OsConstants.SEEK_SET)
                              Os.symlink("/proc/self/fd/" + pfd.fd, out.absolutePath)
                              FileInputStream(out).use { it.read() }
                              keep.add(pfd)
                              return out
                          }
                      }
                  } catch (e: Exception) {
                  }
                  out.delete()
                  try { opened?.close() } catch (e: Exception) { }
                  val ins = ctx.contentResolver.openInputStream(uri)
                      ?: throw IOException("não consegui abrir " + out.name + " (permissão perdida? remova o jogo e adicione de novo)")
                  ins.use { i -> FileOutputStream(out).use { o -> i.copyTo(o) } }
                  return out
              }
          }
