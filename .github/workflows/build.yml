          package dev.n64emu.app

          import android.content.Context
          import org.json.JSONArray
          import org.json.JSONObject

          data class Game(
              val id: String, val uri: String, val title: String, val romName: String, var cover: String?,
              val system: String = "n64", val extras: List<String> = emptyList()
          )

          class Library(ctx: Context) {
              private val prefs = ctx.getSharedPreferences("n64emu_lib", Context.MODE_PRIVATE)
              val games = mutableListOf<Game>()

              init { load() }

              private fun load() {
                  games.clear()
                  try {
                      val arr = JSONArray(prefs.getString("games", "[]"))
                      for (i in 0 until arr.length()) {
                          val o = arr.getJSONObject(i)
                          val cover = if (o.has("cover") && !o.isNull("cover")) o.getString("cover") else null
                          val ex = ArrayList<String>()
                          val ja = o.optJSONArray("extras")
                          if (ja != null) for (k in 0 until ja.length()) ex.add(ja.getString(k))
                          games.add(Game(o.getString("id"), o.getString("uri"), o.getString("title"), o.optString("romName"), cover, o.optString("system", "n64"), ex))
                      }
                  } catch (e: Exception) {
                      games.clear()
                  }
              }

              @Synchronized
              fun save() {
                  val arr = JSONArray()
                  for (g in games) {
                      val o = JSONObject()
                      o.put("id", g.id)
                      o.put("uri", g.uri)
                      o.put("title", g.title)
