                  val labels = listOf("🎮\nJogos", "🧩\nMods", "👥\nSala", "⚙️\nConfig")
                  val items = ArrayList<TextView>()
                  for ((i, l) in labels.withIndex()) {
                      val t = TextView(this)
                      t.text = l
                      t.gravity = Gravity.CENTER
                      t.textSize = 12f
                      t.setPadding(0, dp(8), 0, dp(8))
                      t.setOnClickListener { select(i) }
                      nav.addView(t, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))
                      items.add(t)
                  }
                  navItems = items
                  root.addView(nav)
                  setContentView(root)
                  select(0)

                  val prefs = getSharedPreferences("n64emu", MODE_PRIVATE)
                  if (prefs.getBoolean("game_running", false)) {
                      prefs.edit().putBoolean("game_running", false).apply()
                      Toast.makeText(this, "O jogo anterior fechou de forma inesperada. Veja Config > Diagnóstico.", Toast.LENGTH_LONG).show()
                  }
