          package dev.n64emu.app

          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.net.Uri
          import java.io.File
          import java.net.HttpURLConnection
          import java.net.URL
          import java.net.URLEncoder

          object Covers {
              fun dir(ctx: Context): File = File(ctx.filesDir, "covers").apply { mkdirs() }

              /** Busca a capa nos thumbnails do libretro pelo nome do arquivo da ROM (padrão No-Intro). */
              fun fetchOnline(ctx: Context, g: Game): String? {
                  try {
                      val clean = g.title.replace(Regex("""[&*/:`<>?\\|"]"""), "_")
                      val enc = URLEncoder.encode(clean, "UTF-8").replace("+", "%20")
                      val folder = if (g.system == "ps1") "Sony%20-%20PlayStation" else "Nintendo%20-%20Nintendo%2064"
                      val url = "https://thumbnails.libretro.com/$folder/Named_Boxarts/$enc.png"
                      val c = URL(url).openConnection() as HttpURLConnection
                      c.connectTimeout = 8000
                      c.readTimeout = 8000
                      if (c.responseCode != 200) return null
                      val out = File(dir(ctx), g.id + ".png")
                      c.inputStream.use { i -> out.outputStream().use { o -> i.copyTo(o) } }
                      return out.absolutePath
                  } catch (e: Exception) {
                      return null
                  }
              }

              fun saveFromUri(ctx: Context, uri: Uri, id: String): String? {
                  try {
                      val bounds = BitmapFactory.Options()
                      bounds.inJustDecodeBounds = true
                      ctx.contentResolver.openInputStream(uri)?.use { BitmapFactory.decodeStream(it, null, bounds) }
                      var s = 1
                      while (bounds.outWidth / s > 600) s *= 2
                      val opts = BitmapFactory.Options()
                      opts.inSampleSize = s
                      val bmp = ctx.contentResolver.openInputStream(uri)?.use { BitmapFactory.decodeStream(it, null, opts) } ?: return null
                      val f = File(dir(ctx), "$id.jpg")
                      f.outputStream().use { bmp.compress(Bitmap.CompressFormat.JPEG, 90, it) }
                      return f.absolutePath
                  } catch (e: Exception) {
                      return null
                  }
              }

              fun load(path: String, maxW: Int): Bitmap? {
                  try {
                      val bounds = BitmapFactory.Options()
                      bounds.inJustDecodeBounds = true
                      BitmapFactory.decodeFile(path, bounds)
                      var s = 1
                      while (bounds.outWidth / (s * 2) >= maxW) s *= 2
                      val opts = BitmapFactory.Options()
                      opts.inSampleSize = s
                      return BitmapFactory.decodeFile(path, opts)
                  } catch (e: Exception) {
                      return null
                  }
              }
          }
