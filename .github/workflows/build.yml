          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'N64EMU_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_bg" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
              <monochrome android:drawable="@drawable/ic_launcher_monochrome" />
          </adaptive-icon>
          N64EMU_EOF
          cat > app/src/main/res/values/colors.xml <<'N64EMU_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_bg">#0B0720</color>
          </resources>
          N64EMU_EOF
          cat > app/src/main/res/values/strings.xml <<'N64EMU_EOF'
          <resources><string name="app_name">muntdroid</string></resources>
          N64EMU_EOF
          cat > build.gradle.kts <<'N64EMU_EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          N64EMU_EOF
          cat > gradle.properties <<'N64EMU_EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          N64EMU_EOF
          cat > settings.gradle.kts <<'N64EMU_EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "muntdroid"
          include(":app")
          N64EMU_EOF
      - name: Baixar núcleo N64 (GLideN64) e libretro.h
        run: |
          set -euo pipefail
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/cpp/include
          BASE=https://buildbot.libretro.com/nightly/android/latest/arm64-v8a
          ok=0
          for try in 1 2 3; do
            if curl -fL --retry 3 --retry-delay 3 -o core.zip "$BASE/mupen64plus_next_gles3_libretro_android.so.zip" && unzip -tq core.zip; then
              ok=1
              break
            fi
            echo "tentativa $try de baixar o nucleo falhou"
            sleep 5
          done
          if [ "$ok" != 1 ]; then
            echo "::error::Nao consegui baixar o nucleo mupen64plus_next (GLES3) do buildbot do libretro."
            exit 1
          fi
          rm -rf core_tmp
          unzip -o core.zip -d core_tmp
          SO=$(find core_tmp -type f -name '*.so' -print -quit)
          if [ -z "$SO" ]; then
            echo "::error::O zip do nucleo nao tem nenhum .so"
            exit 1
          fi
          cp "$SO" app/src/main/jniLibs/arm64-v8a/libmupen_core.so
          CORE=app/src/main/jniLibs/arm64-v8a/libmupen_core.so
          SIZE=$(stat -c %s "$CORE")
          echo "nucleo: $(basename "$SO") ($SIZE bytes)"
          if [ "$SIZE" -lt 1000000 ]; then
            echo "::error::Nucleo pequeno demais, download corrompido?"
            exit 1
          fi
          echo "== cabecalho do nucleo =="
          readelf -h "$CORE" | grep -E 'Class|Machine|Type'
          if ! readelf -h "$CORE" | grep -q 'AArch64'; then
            echo "::error::O nucleo baixado nao e arm64-v8a"
            exit 1
          fi
          echo "== simbolos libretro exportados =="
          readelf --dyn-syms -W "$CORE" > core_syms.txt
          MISSING=0
          for sym in retro_set_environment retro_set_video_refresh retro_set_audio_sample retro_set_audio_sample_batch retro_set_input_poll retro_set_input_state retro_init retro_deinit retro_get_system_info retro_get_system_av_info retro_load_game retro_unload_game retro_run; do
            if grep -qE " $sym\$" core_syms.txt; then
              echo "ok     $sym"
            else
              echo "FALTA  $sym"
              MISSING=1
            fi
          done
          if grep -qE " retro_set_controller_port_device\$" core_syms.txt; then
            echo "ok     retro_set_controller_port_device (4 controles)"
          else
            echo "aviso: o nucleo nao exporta retro_set_controller_port_device"
          fi
          if [ "$MISSING" != 0 ]; then
            echo "::error::O nucleo baixado nao exporta as funcoes libretro necessarias"
            exit 1
          fi
          curl -fL --retry 3 --retry-delay 3 -o app/src/main/cpp/include/libretro.h https://raw.githubusercontent.com/libretro/libretro-common/master/include/libretro.h
          echo "== dependencias do nucleo =="
          readelf -d "$CORE" | grep NEEDED || true
          if readelf -d "$CORE" | grep -q 'libc++_shared.so'; then
            echo "nucleo precisa de libc++_shared.so: copiando do NDK"
            STL=$(find "$ANDROID_HOME/ndk/26.1.10909125" -path '*aarch64-linux-android/libc++_shared.so' 2>/dev/null | head -n 1)
            if [ -z "$STL" ]; then
              STL=$(find "$ANDROID_HOME/ndk" -path '*aarch64-linux-android/libc++_shared.so' | sort | tail -n 1)
            fi
            if [ -z "$STL" ]; then
              echo "::error::libc++_shared.so nao encontrada no NDK"
              exit 1
            fi
            echo "usando $STL"
            cp "$STL" app/src/main/jniLibs/arm64-v8a/
          fi
          ls -la app/src/main/jniLibs/arm64-v8a
      - name: Baixar núcleo PS1 (PCSX ReARMed)
        run: |
          set -euo pipefail
          mkdir -p app/src/main/jniLibs/arm64-v8a
          BASE=https://buildbot.libretro.com/nightly/android/latest/arm64-v8a
          ok=0
          for try in 1 2 3; do
            if curl -fL --retry 3 --retry-delay 3 -o ps1core.zip "$BASE/pcsx_rearmed_libretro_android.so.zip" && unzip -tq ps1core.zip; then
              ok=1
              break
            fi
            echo "tentativa $try de baixar o nucleo PS1 falhou"
            sleep 5
          done
          if [ "$ok" != 1 ]; then
            echo "::error::Nao consegui baixar o nucleo pcsx_rearmed (PS1) do buildbot do libretro."
            exit 1
          fi
          rm -rf ps1_tmp
          unzip -o ps1core.zip -d ps1_tmp
          SO=$(find ps1_tmp -type f -name '*.so' -print -quit)
          if [ -z "$SO" ]; then
            echo "::error::O zip do nucleo PS1 nao tem nenhum .so"
            exit 1
          fi
          CORE=app/src/main/jniLibs/arm64-v8a/libpsx_core.so
          cp "$SO" "$CORE"
          SIZE=$(stat -c %s "$CORE")
          echo "nucleo PS1: $(basename "$SO") ($SIZE bytes)"
          if [ "$SIZE" -lt 500000 ]; then
            echo "::error::Nucleo PS1 pequeno demais, download corrompido?"
            exit 1
          fi
          if ! readelf -h "$CORE" | grep -q 'AArch64'; then
            echo "::error::O nucleo PS1 baixado nao e arm64-v8a"
            exit 1
          fi
          readelf --dyn-syms -W "$CORE" > ps1_syms.txt
          MISSING=0
          for sym in retro_set_environment retro_set_video_refresh retro_set_audio_sample retro_set_audio_sample_batch retro_set_input_poll retro_set_input_state retro_init retro_deinit retro_get_system_info retro_get_system_av_info retro_load_game retro_unload_game retro_run; do
            if grep -qE " $sym\$" ps1_syms.txt; then
              echo "ok     $sym"
            else
              echo "FALTA  $sym"
              MISSING=1
            fi
          done
          if [ "$MISSING" != 0 ]; then
            echo "::error::O nucleo PS1 nao exporta as funcoes libretro necessarias"
            exit 1
          fi
          echo "== dependencias do nucleo PS1 =="
          readelf -d "$CORE" | grep NEEDED || true
          if readelf -d "$CORE" | grep -q 'libc++_shared.so' && [ ! -f app/src/main/jniLibs/arm64-v8a/libc++_shared.so ]; then
            STL=$(find "$ANDROID_HOME/ndk" -path '*aarch64-linux-android/libc++_shared.so' | sort | tail -n 1)
            if [ -z "$STL" ]; then
              echo "::error::libc++_shared.so nao encontrada no NDK"
              exit 1
            fi
            cp "$STL" app/src/main/jniLibs/arm64-v8a/
          fi
          ls -la app/src/main/jniLibs/arm64-v8a
      - name: Build muntdroid APK debug
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: muntdroid-debug
          path: app/build/outputs/apk/debug/*.apk
