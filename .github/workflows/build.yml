          package dev.n64emu.app

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.view.MotionEvent
          import android.view.View
          import kotlin.math.hypot

          /**
           * Controles na tela. IDs 0..15 = botões RetroPad; 100..103 = botões C (N64).
           * Os analógicos são fixos: o círculo fica sempre no mesmo lugar e o dedo que o toca move o botão
           * (só aquele dedo o controla). No PS1 há dois: esquerdo (canto esquerdo) e direito (canto direito).
           */
          class ControlsView(ctx: Context, private val ps1: Boolean = false) : View(ctx) {
              private class Btn(val id: Int, val label: String, val cx: Float, val cy: Float, val r: Float)

              private class Stick(val which: Int) {
                  var pid = -1
                  var ox = 0f
                  var oy = 0f
                  var kx = 0f
                  var ky = 0f
                  var outX = 0f
                  var outY = 0f
                  var sx = 0f
                  var sy = 0f
                  var homeX = 0f
                  var homeY = 0f
                  fun hit(x: Float, y: Float, r: Float) = hypot(x - homeX, y - homeY) <= r
              }

              private val paint = Paint(Paint.ANTI_ALIAS_FLAG)
              private var btns = listOf<Btn>()
              private val pressed = BooleanArray(16)
              private var cX = 0f
              private var cY = 0f

              private val left = Stick(0)
              private val right = Stick(1)
              private val sticks: Array<Stick> = if (ps1) arrayOf(left, right) else arrayOf(left)
              private var stickR = 0f

              private val dead = 0.12f

              override fun onSizeChanged(w: Int, h: Int, ow: Int, oh: Int) {
                  val u = h.toFloat()
                  val W = w.toFloat()
                  stickR = 0.17f * u
                  left.homeX = 0.17f * W
                  left.homeY = 0.76f * u
                  right.homeX = 0.83f * W
                  right.homeY = 0.80f * u
                  val d = 0.095f * u
                  val dr = 0.05f * u
                  val dx = 0.11f * W
                  val dy = 0.31f * u
                  val ccx = 0.80f * W
                  val ccy = 0.30f * u
                  val cr = 0.05f * u
                  val co = 0.10f * u
                  btns = if (ps1) listOf(
                      Btn(4, "▲", dx, dy - d, dr), Btn(5, "▼", dx, dy + d, dr),
                      Btn(6, "◀", dx - d, dy, dr), Btn(7, "▶", dx + d, dy, dr),
                      Btn(9, "△", 0.86f * W, 0.22f * u, 0.065f * u),
                      Btn(0, "X", 0.86f * W, 0.50f * u, 0.065f * u),
                      Btn(1, "□", 0.79f * W, 0.36f * u, 0.065f * u),
                      Btn(8, "○", 0.93f * W, 0.36f * u, 0.065f * u),
                      Btn(2, "SE", 0.43f * W, 0.92f * u, 0.055f * u),
                      Btn(3, "ST", 0.57f * W, 0.92f * u, 0.055f * u),
                      Btn(14, "L3", 0.34f * W, 0.92f * u, 0.05f * u),
                      Btn(15, "R3", 0.66f * W, 0.92f * u, 0.05f * u),
                      Btn(12, "L2", 0.07f * W, 0.09f * u, 0.065f * u),
                      Btn(10, "L1", 0.16f * W, 0.09f * u, 0.065f * u),
                      Btn(11, "R1", 0.84f * W, 0.09f * u, 0.065f * u),
                      Btn(13, "R2", 0.93f * W, 0.09f * u, 0.065f * u),
                  ) else listOf(
                      Btn(4, "▲", dx, dy - d, dr), Btn(5, "▼", dx, dy + d, dr),
                      Btn(6, "◀", dx - d, dy, dr), Btn(7, "▶", dx + d, dy, dr),
                      Btn(0, "A", 0.91f * W, 0.68f * u, 0.085f * u),
                      Btn(1, "B", 0.80f * W, 0.78f * u, 0.075f * u),
                      Btn(3, "ST", 0.50f * W, 0.92f * u, 0.055f * u),
                      Btn(10, "L", 0.07f * W, 0.09f * u, 0.065f * u),
                      Btn(12, "Z", 0.16f * W, 0.09f * u, 0.065f * u),
                      Btn(11, "R", 0.93f * W, 0.09f * u, 0.065f * u),
                      Btn(100, "C▲", ccx, ccy - co, cr), Btn(101, "C▼", ccx, ccy + co, cr),
                      Btn(102, "C◀", ccx - co, ccy, cr), Btn(103, "C▶", ccx + co, ccy, cr),
                  )
              }

              override fun onDraw(c: Canvas) {
                  for (s in sticks) {
                      val active = s.pid != -1
                      val bx = s.homeX
                      val by = s.homeY
                      paint.style = Paint.Style.FILL
                      paint.color = Color.argb(if (active) 80 else 45, 255, 255, 255)
                      c.drawCircle(bx, by, stickR, paint)
                      paint.style = Paint.Style.STROKE
                      paint.strokeWidth = stickR * 0.06f
                      paint.color = Color.argb(if (active) 170 else 100, 255, 255, 255)
                      c.drawCircle(bx, by, stickR, paint)
                      paint.style = Paint.Style.FILL
                      paint.color = Color.argb(if (active) 190 else 110, 255, 255, 255)
                      c.drawCircle(bx + s.kx * stickR, by + s.ky * stickR, stickR * 0.4f, paint)
                  }
                  for (b in btns) {
                      val on = if (b.id < 16) pressed[b.id] else isCOn(b.id)
                      paint.color = Color.argb(if (on) 170 else 80, 255, 255, 255)
                      c.drawCircle(b.cx, b.cy, b.r, paint)
                      paint.color = Color.argb(220, 0, 0, 0)
                      paint.textSize = b.r * 0.8f
                      paint.textAlign = Paint.Align.CENTER
                      c.drawText(b.label, b.cx, b.cy + b.r * 0.28f, paint)
                  }
              }

              private fun isCOn(id: Int) = when (id) {
                  100 -> cY < -0.5f
                  101 -> cY > 0.5f
                  102 -> cX < -0.5f
                  else -> cX > 0.5f
              }

              private fun overButton(x: Float, y: Float): Boolean {
                  for (b in btns) if (hypot(x - b.cx, y - b.cy) < b.r * 1.25f) return true
                  return false
              }

              private fun isStickPointer(id: Int): Boolean {
                  for (s in sticks) if (s.pid == id) return true
                  return false
              }

              /** Atualiza posição/saída de um analógico a partir do dedo que o controla. */
              private fun updateStick(e: MotionEvent, s: Stick) {
                  s.sx = 0f
                  s.sy = 0f
                  s.kx = 0f
                  s.ky = 0f
                  if (s.pid == -1) return
                  val idx = e.findPointerIndex(s.pid)
                  if (idx < 0) {
                      s.pid = -1
                      return
                  }
                  val px = e.getX(idx)
                  val py = e.getY(idx)
                  var dx = px - s.homeX
                  var dy = py - s.homeY
                  val d = hypot(dx, dy)
                  if (d > stickR) {
                      dx *= stickR / d
                      dy *= stickR / d
                  }
                  var nx = dx / stickR
                  var ny = dy / stickR
                  s.kx = nx
                  s.ky = ny
                  val mag = hypot(nx, ny)
                  if (mag < dead) {
                      nx = 0f
                      ny = 0f
                  } else {
                      val k = ((mag - dead) / (1f - dead)).coerceAtMost(1f) / mag
                      nx *= k
                      ny *= k
                  }
                  s.sx = nx
                  s.sy = ny
              }

              override fun onTouchEvent(e: MotionEvent): Boolean {
                  val act = e.actionMasked
                  val ai = e.actionIndex
                  when (act) {
                      MotionEvent.ACTION_DOWN, MotionEvent.ACTION_POINTER_DOWN -> {
                          val x = e.getX(ai)
                          val y = e.getY(ai)
                          if (!overButton(x, y)) {
                              for (s in sticks) {
                                  if (s.pid == -1 && s.hit(x, y, stickR * 1.35f)) {
                                      s.pid = e.getPointerId(ai)
                                      break
                                  }
                              }
                          }
                      }
                      MotionEvent.ACTION_UP, MotionEvent.ACTION_POINTER_UP -> {
                          val id = e.getPointerId(ai)
                          for (s in sticks) if (s.pid == id) s.pid = -1
                      }
                      MotionEvent.ACTION_CANCEL -> for (s in sticks) s.pid = -1
                  }
                  val lifting = act == MotionEvent.ACTION_UP || act == MotionEvent.ACTION_POINTER_UP
                  val cancel = act == MotionEvent.ACTION_CANCEL

                  // analógicos
                  for (s in sticks) updateStick(e, s)

                  // botões
                  val np = BooleanArray(16)
                  var ncx = 0f
                  var ncy = 0f
                  if (!cancel) {
                      for (i in 0 until e.pointerCount) {
                          if (lifting && i == ai) continue
                          if (isStickPointer(e.getPointerId(i))) continue
                          val x = e.getX(i)
                          val y = e.getY(i)
                          for (b in btns) {
                              if (hypot(x - b.cx, y - b.cy) < b.r * 1.25f) {
                                  when (b.id) {
                                      100 -> ncy = -1f
                                      101 -> ncy = 1f
                                      102 -> ncx = -1f
                                      103 -> ncx = 1f
                                      else -> np[b.id] = true
                                  }
                              }
                          }
                      }
                  }
                  for (i in 0..15) {
                      if (np[i] != pressed[i]) {
                          pressed[i] = np[i]
                          Input.button(i, np[i])
                      }
                  }
                  for (s in sticks) {
                      if (s.sx != s.outX || s.sy != s.outY) {
                          s.outX = s.sx
                          s.outY = s.sy
                          Input.analog(s.which, s.sx, s.sy)
                      }
                  }
                  if (ncx != cX || ncy != cY) {
                      cX = ncx
                      cY = ncy
                      Input.analog(1, cX, cY)
                  }
                  invalidate()
                  return true
              }
          }
