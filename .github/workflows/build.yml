name: Build muntdroid APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Preparar Android SDK (ja vem na maquina)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1" || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Gerar projeto muntdroid
        run: |
          set -e
          mkdir -p app
          mkdir -p app/src/main
          mkdir -p app/src/main/cpp
          mkdir -p app/src/main/java/dev/n64emu/app
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/values
          cat > app/build.gradle.kts <<'N64EMU_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "dev.n64emu.app"
              compileSdk = 34
              ndkVersion = "26.1.10909125"
              defaultConfig {
                  applicationId = "dev.n64emu.app"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 8
                  versionName = "0.8.0"
                  ndk { abiFilters += listOf("arm64-v8a") }
                  externalNativeBuild { cmake { cppFlags += "-std=c++17" } }
              }
              externalNativeBuild { cmake { path = file("src/main/cpp/CMakeLists.txt"); version = "3.22.1" } }
              packaging { jniLibs { useLegacyPackaging = true } }
              buildTypes { release { isMinifyEnabled = false } }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
          }
          N64EMU_EOF
          cat > app/src/main/AndroidManifest.xml <<'N64EMU_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-feature android:glEsVersion="0x00030000" android:required="true" />
              <application
                  android:label="muntdroid"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <activity android:name=".EmulatorActivity"
                      android:screenOrientation="landscape"
                      android:configChanges="orientation|screenSize|keyboardHidden" />
              </application>
          </manifest>
          N64EMU_EOF
          cat > app/src/main/cpp/CMakeLists.txt <<'N64EMU_EOF'
          cmake_minimum_required(VERSION 3.22)
          project(n64emu)

          # libretro.h é baixado pelo CI para app/src/main/cpp/include
          add_library(n64emu SHARED native-lib.cpp)
          target_include_directories(n64emu PRIVATE ${CMAKE_CURRENT_SOURCE_DIR}/include)
          target_link_libraries(n64emu android log EGL GLESv3 aaudio dl)
          N64EMU_EOF
          cat > app/src/main/cpp/native-lib.cpp <<'N64EMU_EOF'
          // Host libretro: carrega o núcleo mupen64plus_next (GLideN64) e roda a ROM.
          #include <jni.h>
          #include <android/log.h>
          #include <android/native_window_jni.h>
          #include <aaudio/AAudio.h>
          #include <EGL/egl.h>
          #include <GLES3/gl3.h>
          #include <dlfcn.h>
          #include <unistd.h>
          #include <algorithm>
          #include <atomic>
          #include <condition_variable>
          #include <cctype>
          #include <cstdarg>
          #include <cstdio>
          #include <cstring>
          #include <map>
          #include <cstdint>
          #include <cstdlib>
          #include <mutex>
          #include <pthread.h>
          #include <set>
          #include <string>
          #include <thread>
          #include <vector>
          #include "libretro.h"

          #define TAG "N64Emu"

          namespace {

          FILE* g_logf = nullptr;
          std::mutex g_logMutex;
          std::string g_status;
          std::mutex g_statusMutex;

          void logm(int prio, const char* tag, const char* fmt, ...) {
              char buf[1024];
              va_list ap;
              va_start(ap, fmt);
              vsnprintf(buf, sizeof(buf), fmt, ap);
              va_end(ap);
              __android_log_write(prio, tag, buf);
              std::lock_guard<std::mutex> l(g_logMutex);
              if (g_logf) { fprintf(g_logf, "[%s] %s\n", tag, buf); fflush(g_logf); }
          }
          #define LOGI(...) logm(ANDROID_LOG_INFO, TAG, __VA_ARGS__)
          #define LOGE(...) logm(ANDROID_LOG_ERROR, TAG, __VA_ARGS__)

          void setStatus(const std::string& s) {
              std::lock_guard<std::mutex> l(g_statusMutex);
              g_status = s;
              if (s.rfind("ERRO", 0) == 0) LOGE("%s", s.c_str());
          }

          void* g_lib = nullptr;
          void (*p_set_environment)(retro_environment_t);
          void (*p_set_video_refresh)(retro_video_refresh_t);
          void (*p_set_audio_sample)(retro_audio_sample_t);
          void (*p_set_audio_batch)(retro_audio_sample_batch_t);
          void (*p_set_input_poll)(retro_input_poll_t);
          void (*p_set_input_state)(retro_input_state_t);
          void (*p_init)(void);
          void (*p_deinit)(void);
          void (*p_get_system_info)(struct retro_system_info*);
          void (*p_get_av_info)(struct retro_system_av_info*);
          bool (*p_load_game)(const struct retro_game_info*);
          void (*p_unload_game)(void);
          void (*p_run)(void);
          size_t (*p_get_memory_size)(unsigned) = nullptr;  // opcional (save RAM)
          void* (*p_get_memory_data)(unsigned) = nullptr;  // opcional (save RAM)
          void (*p_set_port_device)(unsigned, unsigned) = nullptr;  // opcional
          size_t (*p_serialize_size)(void) = nullptr;               // opcional (save states)
          bool (*p_serialize)(void*, size_t) = nullptr;             // opcional (save states)
          bool (*p_unserialize)(const void*, size_t) = nullptr;     // opcional (save states)

          std::string g_libPath, g_systemDir, g_saveDir, g_saveName;
          unsigned g_psPadType = RETRO_DEVICE_ANALOG;  // tipo de controle do PS1 (DualShock, descoberto via SET_CONTROLLER_INFO)
          bool g_isPs1 = false;     // nucleo de PlayStation (renderizacao por software, 2 portas por padrao)
          bool g_swFrame = false;   // nucleo entrega pixels (sem HW render): sobe cada quadro numa textura
          std::vector<uint8_t> g_lastSram;
          unsigned g_sramFrames = 0;
          std::map<std::string, std::string> g_options;
          std::mutex g_optMutex;
          std::atomic<bool> g_optionsDirty{true};

          std::atomic<bool> g_running{false};
          std::atomic<bool> g_paused{false};
          pthread_t g_thread;
          bool g_threadValid = false;
          std::mutex g_pauseMutex;
          std::condition_variable g_pauseCv;
          ANativeWindow* g_window = nullptr;

          EGLDisplay g_dpy = EGL_NO_DISPLAY;
          EGLSurface g_surf = EGL_NO_SURFACE;
          EGLContext g_ctx = EGL_NO_CONTEXT;
          retro_hw_render_callback g_hw{};
          GLuint g_fbo = 0, g_tex = 0, g_rbo = 0;
          unsigned g_fboW = 0, g_fboH = 0;
          unsigned g_frameW = 0, g_frameH = 0;
          enum retro_pixel_format g_pixelFormat = RETRO_PIXEL_FORMAT_XRGB8888;
          std::vector<uint8_t> g_uploadRgba;
          float g_aspect = 4.0f / 3.0f;
          int g_sampleRate = 44100;
          bool g_firstFrame = true;

          AAudioStream* g_audio = nullptr;

          // ---- entrada: 4 portas (0 = dono da sala / jogador local; 1..3 = convidados da sala) ----
          constexpr int MAX_PLAYERS = 4;
          std::atomic<int> g_padBtn[MAX_PLAYERS];
          std::atomic<int> g_padAx[MAX_PLAYERS][4];   // lx, ly, rx, ry
          int clamp16(int v) { return v > 32767 ? 32767 : (v < -32767 ? -32767 : v); }

          std::string g_loadErr;

          // ---- streaming de vídeo para os convidados da sala ----
          constexpr unsigned STREAM_W = 480, STREAM_H = 360;
          std::atomic<bool> g_stream{false};
          GLuint g_sFbo = 0, g_sRbo = 0;
          std::vector<uint8_t> g_sBuf, g_sLatest;
          std::mutex g_sMutex;
          bool g_sNew = false;
          float g_sAspect = 4.0f / 3.0f;
          unsigned g_sCounter = 0;

          #define LOAD(var, name)                                   \
              var = (decltype(var))dlsym(g_lib, name);              \
              if (!var) { g_loadErr = std::string("símbolo ausente no núcleo: ") + name; LOGE("simbolo ausente: %s", name); return false; }

          bool loadCore() {
              g_lib = dlopen(g_libPath.c_str(), RTLD_NOW | RTLD_LOCAL);
              if (!g_lib) {
                  const char* e = dlerror();
                  g_loadErr = e ? e : "dlopen falhou";
                  LOGE("dlopen falhou: %s", g_loadErr.c_str());
                  return false;
              }
              LOAD(p_set_environment, "retro_set_environment");
              LOAD(p_set_video_refresh, "retro_set_video_refresh");
              LOAD(p_set_audio_sample, "retro_set_audio_sample");
              LOAD(p_set_audio_batch, "retro_set_audio_sample_batch");
              LOAD(p_set_input_poll, "retro_set_input_poll");
              LOAD(p_set_input_state, "retro_set_input_state");
              LOAD(p_init, "retro_init");
              LOAD(p_deinit, "retro_deinit");
              LOAD(p_get_system_info, "retro_get_system_info");
              LOAD(p_get_av_info, "retro_get_system_av_info");
              LOAD(p_load_game, "retro_load_game");
              LOAD(p_unload_game, "retro_unload_game");
              LOAD(p_run, "retro_run");
              p_set_port_device = (decltype(p_set_port_device))dlsym(g_lib, "retro_set_controller_port_device");
              p_get_memory_size = (decltype(p_get_memory_size))dlsym(g_lib, "retro_get_memory_size");
              p_get_memory_data = (decltype(p_get_memory_data))dlsym(g_lib, "retro_get_memory_data");
              p_serialize_size = (decltype(p_serialize_size))dlsym(g_lib, "retro_serialize_size");
              p_serialize = (decltype(p_serialize))dlsym(g_lib, "retro_serialize");
              p_unserialize = (decltype(p_unserialize))dlsym(g_lib, "retro_unserialize");
              return true;
          }

          // ---------- FBO ----------
          void createFbo(unsigned w, unsigned h) {
              glGenFramebuffers(1, &g_fbo);
              glGenTextures(1, &g_tex);
              glGenRenderbuffers(1, &g_rbo);
              glBindTexture(GL_TEXTURE_2D, g_tex);
              glTexImage2D(GL_TEXTURE_2D, 0, GL_RGBA8, w, h, 0, GL_RGBA, GL_UNSIGNED_BYTE, nullptr);
              glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_MIN_FILTER, GL_LINEAR);
              glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_MAG_FILTER, GL_LINEAR);
              glBindRenderbuffer(GL_RENDERBUFFER, g_rbo);
              glRenderbufferStorage(GL_RENDERBUFFER, GL_DEPTH24_STENCIL8, w, h);
              glBindFramebuffer(GL_FRAMEBUFFER, g_fbo);
              glFramebufferTexture2D(GL_FRAMEBUFFER, GL_COLOR_ATTACHMENT0, GL_TEXTURE_2D, g_tex, 0);
              glFramebufferRenderbuffer(GL_FRAMEBUFFER, GL_DEPTH_STENCIL_ATTACHMENT, GL_RENDERBUFFER, g_rbo);
              g_fboW = w; g_fboH = h;
              LOGI("FBO %ux%u status=0x%x", w, h, glCheckFramebufferStatus(GL_FRAMEBUFFER));
          }
          void resizeFbo(unsigned w, unsigned h) {
              if (!g_fbo) return;
              if (w <= g_fboW && h <= g_fboH) return;
              if (w < g_fboW) w = g_fboW;
              if (h < g_fboH) h = g_fboH;
              glBindTexture(GL_TEXTURE_2D, g_tex);
              glTexImage2D(GL_TEXTURE_2D, 0, GL_RGBA8, w, h, 0, GL_RGBA, GL_UNSIGNED_BYTE, nullptr);
              glBindRenderbuffer(GL_RENDERBUFFER, g_rbo);
              glRenderbufferStorage(GL_RENDERBUFFER, GL_DEPTH24_STENCIL8, w, h);
              g_fboW = w; g_fboH = h;
              LOGI("FBO redimensionado %ux%u", w, h);
          }
          void destroyFbo() {
              if (g_fbo) glDeleteFramebuffers(1, &g_fbo);
              if (g_tex) glDeleteTextures(1, &g_tex);
              if (g_rbo) glDeleteRenderbuffers(1, &g_rbo);
              g_fbo = g_tex = g_rbo = 0;
              g_fboW = g_fboH = 0;
          }

          // ---------- callbacks ----------
          void logCb(enum retro_log_level level, const char* fmt, ...) {
              char buf[1024];
              va_list ap;
              va_start(ap, fmt);
              vsnprintf(buf, sizeof(buf), fmt, ap);
              va_end(ap);
              size_t n = strlen(buf);
              while (n > 0 && (buf[n - 1] == '\n' || buf[n - 1] == '\r')) buf[--n] = 0;
              int prio = level == RETRO_LOG_ERROR ? ANDROID_LOG_ERROR
                       : level == RETRO_LOG_WARN  ? ANDROID_LOG_WARN
                       : level == RETRO_LOG_INFO  ? ANDROID_LOG_INFO : ANDROID_LOG_DEBUG;
              logm(prio, "N64Core", "%s", buf);
          }

          uintptr_t getCurrentFb() { return (uintptr_t)g_fbo; }
          retro_proc_address_t getProc(const char* sym) {
              void* p = (void*)eglGetProcAddress(sym);
              if (!p) p = dlsym(RTLD_DEFAULT, sym);
              return (retro_proc_address_t)p;
          }

          void updateAspect(const retro_game_geometry& g) {
              if (g.aspect_ratio > 0) g_aspect = g.aspect_ratio;
              else if (g.base_height) g_aspect = (float)g.base_width / (float)g.base_height;
          }

          bool envCb(unsigned cmd, void* data) {
              static std::set<unsigned> seen;
              switch (cmd) {
                  case RETRO_ENVIRONMENT_GET_CAN_DUPE: *(bool*)data = true; return true;
                  case RETRO_ENVIRONMENT_SET_PIXEL_FORMAT:
                      g_pixelFormat = *(enum retro_pixel_format*)data;
                      LOGI("formato de pixel solicitado pelo nucleo: %d", (int)g_pixelFormat);
                      return g_pixelFormat == RETRO_PIXEL_FORMAT_XRGB8888 ||
                             g_pixelFormat == RETRO_PIXEL_FORMAT_RGB565 ||
                             g_pixelFormat == RETRO_PIXEL_FORMAT_0RGB1555;
                  case RETRO_ENVIRONMENT_GET_SYSTEM_DIRECTORY: *(const char**)data = g_systemDir.c_str(); return true;
                  case RETRO_ENVIRONMENT_GET_SAVE_DIRECTORY: *(const char**)data = g_saveDir.c_str(); return true;
                  case RETRO_ENVIRONMENT_GET_LOG_INTERFACE: ((retro_log_callback*)data)->log = logCb; return true;
                  case RETRO_ENVIRONMENT_GET_VARIABLE: {
                      auto* v = (retro_variable*)data;
                      std::lock_guard<std::mutex> l(g_optMutex);
                      auto it = g_options.find(v->key);
                      if (it == g_options.end()) return false;
                      v->value = it->second.c_str();
                      return true;
                  }
                  case RETRO_ENVIRONMENT_GET_VARIABLE_UPDATE:
                      *(bool*)data = g_optionsDirty.exchange(false);
                      return true;
                  case RETRO_ENVIRONMENT_SET_VARIABLES: {
                      // como o RetroArch: registra o valor padrao (primeira opcao) de cada variavel do nucleo,
                      // sem sobrescrever o que o usuario ja configurou
                      const retro_variable* v = (const retro_variable*)data;
                      std::lock_guard<std::mutex> l(g_optMutex);
                      int n = 0;
                      for (; v && v->key; v++) {
                          n++;
                          if (!v->value || g_options.count(v->key)) continue;
                          const char* semi = strstr(v->value, "; ");
                          if (!semi) continue;
                          std::string rest = semi + 2;
                          size_t bar = rest.find('|');
                          g_options[v->key] = rest.substr(0, bar);
                      }
                      g_optionsDirty = true;
                      LOGI("opcoes do nucleo registradas: %d", n);
                      return true;
                  }
                  case RETRO_ENVIRONMENT_SET_SERIALIZATION_QUIRKS: return true;
                  case RETRO_ENVIRONMENT_SET_GEOMETRY:
                      updateAspect(*(retro_game_geometry*)data);
                      return true;
                  case RETRO_ENVIRONMENT_SET_SYSTEM_AV_INFO: {
                      auto* av = (retro_system_av_info*)data;
                      updateAspect(av->geometry);
                      if (av->timing.sample_rate > 0) g_sampleRate = (int)av->timing.sample_rate;
                      resizeFbo(av->geometry.max_width, av->geometry.max_height);
                      return true;
                  }
                  case RETRO_ENVIRONMENT_SET_HW_RENDER: {
                      auto* hw = (retro_hw_render_callback*)data;
                      // Mupen64Plus-Next GLES3 pede HW context, mas deixa a versao
                      // como 0.0. Negociar explicitamente GLES 3.0 evita entregar
                      // ao nucleo um contexto sem versao definida.
                      const bool gles = hw->context_type == RETRO_HW_CONTEXT_OPENGLES3 ||
                                        hw->context_type == RETRO_HW_CONTEXT_OPENGLES2 ||
                                        hw->context_type == RETRO_HW_CONTEXT_OPENGLES_VERSION;
                      if (hw->context_type == RETRO_HW_CONTEXT_OPENGLES3) {
                          hw->version_major = 3;
                          hw->version_minor = 0;
                      }
                      if (!gles) LOGE("HW render recusado: tipo de contexto %u nao e OpenGL ES", (unsigned)hw->context_type);
                      hw->get_current_framebuffer = getCurrentFb;
                      hw->get_proc_address = getProc;
                      // O FBO e criado no mesmo contexto EGL antes de context_reset.
                      // Preservar os callbacks do nucleo e habilitar cache do contexto.
                      hw->cache_context = true;
                      g_hw = *hw;
                      LOGI("HW render aceito: tipo=%u GLES=%u.%u depth=%d stencil=%d bottom_left=%d",
                           (unsigned)hw->context_type, hw->version_major, hw->version_minor,
                           (int)hw->depth, (int)hw->stencil, (int)hw->bottom_left_origin);
                      return gles;
                  }
                  case RETRO_ENVIRONMENT_GET_LIBRETRO_PATH: *(const char**)data = g_libPath.c_str(); return true;
                  case RETRO_ENVIRONMENT_GET_CORE_ASSETS_DIRECTORY: *(const char**)data = g_systemDir.c_str(); return true;
                  case RETRO_ENVIRONMENT_GET_PREFERRED_HW_RENDER: *(unsigned*)data = RETRO_HW_CONTEXT_OPENGLES3; return true;
                  case RETRO_ENVIRONMENT_GET_LANGUAGE: *(unsigned*)data = RETRO_LANGUAGE_ENGLISH; return true;
                  case RETRO_ENVIRONMENT_SET_PERFORMANCE_LEVEL: return true;
                  case RETRO_ENVIRONMENT_SET_ROTATION: return true;
                  case RETRO_ENVIRONMENT_SET_MESSAGE: {
                      const retro_message* m = (const retro_message*)data;
                      if (m && m->msg) LOGI("mensagem do nucleo: %s", m->msg);
                      return true;
                  }
                  case RETRO_ENVIRONMENT_SET_INPUT_DESCRIPTORS: return true;
                  case RETRO_ENVIRONMENT_SET_CONTROLLER_INFO: {
                      // O PCSX ReARMed lista: standard, analog (= joystick de aviao!), dualshock, negcon...
                      // O que queremos e o DualShock (2 analogicos); pegamos o id pelo nome.
                      const retro_controller_info* ci = (const retro_controller_info*)data;
                      bool found = false;
                      for (; ci && ci->types && !found; ci++) {
                          for (unsigned i = 0; i < ci->num_types; i++) {
                              const char* d = ci->types[i].desc;
                              if (!d) continue;
                              std::string s = d;
                              for (auto& ch : s) ch = (char)tolower((unsigned char)ch);
                              LOGI("controle disponivel: %s (id=%u)", d, ci->types[i].id);
                              if (s.find("dualshock") != std::string::npos) {
                                  g_psPadType = ci->types[i].id;
                                  found = true;
                                  break;
                              }
                          }
                      }
                      return true;
                  }
                  default:
                      if (seen.insert(cmd).second) LOGI("env cmd %u nao tratado", cmd);
                      return false;
              }
          }

          void present() {
              EGLint sw = 0, sh = 0;
              eglQuerySurface(g_dpy, g_surf, EGL_WIDTH, &sw);
              eglQuerySurface(g_dpy, g_surf, EGL_HEIGHT, &sh);
              GLboolean scissor = glIsEnabled(GL_SCISSOR_TEST);
              GLint oldVp[4];
              GLfloat oldCc[4];
              GLboolean oldCm[4];
              glGetIntegerv(GL_VIEWPORT, oldVp);
              glGetFloatv(GL_COLOR_CLEAR_VALUE, oldCc);
              glGetBooleanv(GL_COLOR_WRITEMASK, oldCm);
              glColorMask(GL_TRUE, GL_TRUE, GL_TRUE, GL_TRUE);
              glDisable(GL_SCISSOR_TEST);
              glBindFramebuffer(GL_DRAW_FRAMEBUFFER, 0);
              glViewport(0, 0, sw, sh);
              glClearColor(0, 0, 0, 1);
              glClear(GL_COLOR_BUFFER_BIT);
              int dw = sw, dh = (int)(sw / g_aspect);
              if (dh > sh) { dh = sh; dw = (int)(sh * g_aspect); }
              int dx = (sw - dw) / 2, dy = (sh - dh) / 2;
              unsigned fw = g_frameW < g_fboW ? g_frameW : g_fboW;
              unsigned fh = g_frameH < g_fboH ? g_frameH : g_fboH;
              glBindFramebuffer(GL_READ_FRAMEBUFFER, g_fbo);
              if (g_swFrame) glBlitFramebuffer(0, 0, fw, fh, dx, dy + dh, dx + dw, dy, GL_COLOR_BUFFER_BIT, GL_LINEAR);
              else glBlitFramebuffer(0, 0, fw, fh, dx, dy, dx + dw, dy + dh, GL_COLOR_BUFFER_BIT, GL_LINEAR);
              glBindFramebuffer(GL_FRAMEBUFFER, g_fbo);
              if (scissor) glEnable(GL_SCISSOR_TEST);
              glViewport(oldVp[0], oldVp[1], oldVp[2], oldVp[3]);
              glClearColor(oldCc[0], oldCc[1], oldCc[2], oldCc[3]);
              glColorMask(oldCm[0], oldCm[1], oldCm[2], oldCm[3]);
              eglSwapBuffers(g_dpy, g_surf);
          }

          void streamCapture() {
              unsigned fw = g_frameW < g_fboW ? g_frameW : g_fboW;
              unsigned fh = g_frameH < g_fboH ? g_frameH : g_fboH;
              if (!fw || !fh || !g_fbo) return;
              if (!g_sFbo) {
                  // renderbuffer (e não textura) para não mexer nos bindings de textura do núcleo
                  glGenFramebuffers(1, &g_sFbo);
                  glGenRenderbuffers(1, &g_sRbo);
                  glBindRenderbuffer(GL_RENDERBUFFER, g_sRbo);
                  glRenderbufferStorage(GL_RENDERBUFFER, GL_RGBA8, STREAM_W, STREAM_H);
                  glBindRenderbuffer(GL_RENDERBUFFER, 0);
                  glBindFramebuffer(GL_FRAMEBUFFER, g_sFbo);
                  glFramebufferRenderbuffer(GL_FRAMEBUFFER, GL_COLOR_ATTACHMENT0, GL_RENDERBUFFER, g_sRbo);
                  LOGI("FBO de stream %ux%u status=0x%x", STREAM_W, STREAM_H, glCheckFramebufferStatus(GL_FRAMEBUFFER));
                  g_sBuf.assign((size_t)STREAM_W * STREAM_H * 4, 0);
                  std::lock_guard<std::mutex> l(g_sMutex);
                  g_sLatest.assign((size_t)STREAM_W * STREAM_H * 4, 0);
              }
              GLboolean scissor = glIsEnabled(GL_SCISSOR_TEST);
              glDisable(GL_SCISSOR_TEST);
              glBindFramebuffer(GL_READ_FRAMEBUFFER, g_fbo);
              glBindFramebuffer(GL_DRAW_FRAMEBUFFER, g_sFbo);
              // y invertido: glReadPixels devolve de baixo para cima; o Bitmap do Android é de cima para baixo
              if (g_swFrame) glBlitFramebuffer(0, 0, fw, fh, 0, 0, STREAM_W, STREAM_H, GL_COLOR_BUFFER_BIT, GL_LINEAR);
              else glBlitFramebuffer(0, 0, fw, fh, 0, STREAM_H, STREAM_W, 0, GL_COLOR_BUFFER_BIT, GL_LINEAR);
              glBindFramebuffer(GL_READ_FRAMEBUFFER, g_sFbo);
              glReadPixels(0, 0, STREAM_W, STREAM_H, GL_RGBA, GL_UNSIGNED_BYTE, g_sBuf.data());
              glBindFramebuffer(GL_FRAMEBUFFER, g_fbo);
              if (scissor) glEnable(GL_SCISSOR_TEST);
              std::lock_guard<std::mutex> l(g_sMutex);
              g_sBuf.swap(g_sLatest);
              g_sNew = true;
              g_sAspect = g_aspect;
          }

          void destroyStream() {
              if (g_sFbo) glDeleteFramebuffers(1, &g_sFbo);
              if (g_sRbo) glDeleteRenderbuffers(1, &g_sRbo);
              g_sFbo = g_sRbo = 0;
          }

          void uploadSoftwareFrame(const void* data, unsigned w, unsigned h, size_t pitch) {
              if (w > g_fboW || h > g_fboH) resizeFbo(w > g_fboW ? w : g_fboW, h > g_fboH ? h : g_fboH);
              g_uploadRgba.resize((size_t)w * h * 4);
              uint8_t* dst = g_uploadRgba.data();
              const uint8_t* src = (const uint8_t*)data;
              for (unsigned y = 0; y < h; y++, src += pitch) {
                  if (g_pixelFormat == RETRO_PIXEL_FORMAT_RGB565) {
                      const uint16_t* p = (const uint16_t*)src;
                      for (unsigned x = 0; x < w; x++) {
                          uint16_t v = p[x];
                          uint8_t r = (v >> 11) & 31, g = (v >> 5) & 63, b = v & 31;
                          *dst++ = (uint8_t)((r << 3) | (r >> 2));
                          *dst++ = (uint8_t)((g << 2) | (g >> 4));
                          *dst++ = (uint8_t)((b << 3) | (b >> 2));
                          *dst++ = 255;
                      }
                  } else if (g_pixelFormat == RETRO_PIXEL_FORMAT_0RGB1555) {
                      const uint16_t* p = (const uint16_t*)src;
                      for (unsigned x = 0; x < w; x++) {
                          uint16_t v = p[x];
                          uint8_t r = (v >> 10) & 31, g = (v >> 5) & 31, b = v & 31;
                          *dst++ = (uint8_t)((r << 3) | (r >> 2));
                          *dst++ = (uint8_t)((g << 3) | (g >> 2));
                          *dst++ = (uint8_t)((b << 3) | (b >> 2));
                          *dst++ = 255;
                      }
                  } else {
                      const uint8_t* p = src;  // XRGB8888 little-endian: B, G, R, X
                      for (unsigned x = 0; x < w; x++, p += 4) {
                          *dst++ = p[2];
                          *dst++ = p[1];
                          *dst++ = p[0];
                          *dst++ = 255;
                      }
                  }
              }
              glBindTexture(GL_TEXTURE_2D, g_tex);
              glPixelStorei(GL_UNPACK_ALIGNMENT, 4);
              glTexSubImage2D(GL_TEXTURE_2D, 0, 0, 0, w, h, GL_RGBA, GL_UNSIGNED_BYTE, g_uploadRgba.data());
          }

          void videoCb(const void* data, unsigned w, unsigned h, size_t pitch) {
              // Em HW rendering Libretro, data == nullptr e NORMAL: o nucleo
              // desenha diretamente no framebuffer devolvido por getCurrentFb().
              // Portanto, nunca descartar o callback apenas porque data e nulo.
              if (!g_fbo) return;
              if (w > 0 && h > 0) {
                  g_frameW = w;
                  g_frameH = h;
              }
              // nucleos sem HW render (PS1) entregam os pixels aqui; data == nullptr repete o quadro anterior
              if (g_swFrame && data && data != RETRO_HW_FRAME_BUFFER_VALID && w > 0 && h > 0) uploadSoftwareFrame(data, w, h, pitch);
              if (g_firstFrame) {
                  g_firstFrame = false;
                  LOGI("primeiro callback de video %ux%u data=%s pitch=%zu fbo=%u",
                       w, h, data ? "pixels" : "HW/null", pitch, (unsigned)g_fbo);
              }
              // O callback de video sinaliza que o nucleo terminou o frame.
              // Para HW rendering, apresentar o FBO mesmo quando data == nullptr.
              if (g_frameW > 0 && g_frameH > 0) present();
              // Captura separada somente para transmitir o video aos convidados.
              if (g_stream.load() && ((++g_sCounter) & 1) == 0) streamCapture();
          }

          void audioOpen(int rate) {
              AAudioStreamBuilder* b = nullptr;
              if (AAudio_createStreamBuilder(&b) != AAUDIO_OK) return;
              AAudioStreamBuilder_setDirection(b, AAUDIO_DIRECTION_OUTPUT);
              AAudioStreamBuilder_setFormat(b, AAUDIO_FORMAT_PCM_I16);
              AAudioStreamBuilder_setChannelCount(b, 2);
              AAudioStreamBuilder_setSampleRate(b, rate);
              AAudioStreamBuilder_setPerformanceMode(b, AAUDIO_PERFORMANCE_MODE_LOW_LATENCY);
              if (AAudioStreamBuilder_openStream(b, &g_audio) == AAUDIO_OK) AAudioStream_requestStart(g_audio);
              else { g_audio = nullptr; LOGE("AAudio nao abriu"); }
              AAudioStreamBuilder_delete(b);
          }
          void audioClose() {
              if (g_audio) { AAudioStream_requestStop(g_audio); AAudioStream_close(g_audio); g_audio = nullptr; }
          }
          size_t audioBatchCb(const int16_t* d, size_t frames) {
              bool ok = false;
              if (g_audio) {
                  aaudio_result_t r = AAudioStream_write(g_audio, d, (int32_t)frames, 50LL * 1000000LL);
                  ok = r >= 0;
              }
              if (!ok && g_sampleRate > 0) usleep((useconds_t)((long long)frames * 1000000LL / g_sampleRate));
              return frames;
          }
          void audioSampleCb(int16_t l, int16_t r) { int16_t s[2] = {l, r}; audioBatchCb(s, 1); }

          void pollCb() {}
          int16_t stateCb(unsigned port, unsigned device, unsigned index, unsigned id) {
              if (port >= (unsigned)MAX_PLAYERS) return 0;
              device &= RETRO_DEVICE_MASK;
              if (device == RETRO_DEVICE_JOYPAD) {
                  int b = g_padBtn[port].load();
                  if (id == RETRO_DEVICE_ID_JOYPAD_MASK) return (int16_t)b;
                  if (id > 15) return 0;
                  return (int16_t)((b >> id) & 1);
              }
              if (device == RETRO_DEVICE_ANALOG) {
                  int base = (index == RETRO_DEVICE_INDEX_ANALOG_RIGHT) ? 2 : 0;
                  if (index != RETRO_DEVICE_INDEX_ANALOG_LEFT && index != RETRO_DEVICE_INDEX_ANALOG_RIGHT) return 0;
                  if (id == RETRO_DEVICE_ID_ANALOG_X) return (int16_t)g_padAx[port][base].load();
                  if (id == RETRO_DEVICE_ID_ANALOG_Y) return (int16_t)g_padAx[port][base + 1].load();
              }
              return 0;
          }

          // ---------- EGL ----------
          bool eglInit() {
              g_dpy = eglGetDisplay(EGL_DEFAULT_DISPLAY);
              if (g_dpy == EGL_NO_DISPLAY || !eglInitialize(g_dpy, nullptr, nullptr)) { LOGE("eglInitialize falhou"); return false; }
              const EGLint cfgAttr[] = {EGL_RENDERABLE_TYPE, 0x0040 /*ES3*/, EGL_SURFACE_TYPE, EGL_WINDOW_BIT,
                                        EGL_RED_SIZE, 8, EGL_GREEN_SIZE, 8, EGL_BLUE_SIZE, 8, EGL_ALPHA_SIZE, 8, EGL_NONE};
              EGLConfig cfg; EGLint n = 0;
              if (!eglChooseConfig(g_dpy, cfgAttr, &cfg, 1, &n) || n < 1) { LOGE("eglChooseConfig falhou"); return false; }
              g_surf = eglCreateWindowSurface(g_dpy, cfg, g_window, nullptr);
              if (g_surf == EGL_NO_SURFACE) { LOGE("eglCreateWindowSurface falhou"); return false; }
              const int vers[3][2] = {{3, 2}, {3, 1}, {3, 0}};
              for (int i = 0; i < 3 && g_ctx == EGL_NO_CONTEXT; i++) {
                  const EGLint a[] = {0x3098 /*MAJOR*/, vers[i][0], 0x30FB /*MINOR*/, vers[i][1], EGL_NONE};
                  g_ctx = eglCreateContext(g_dpy, cfg, EGL_NO_CONTEXT, a);
                  if (g_ctx != EGL_NO_CONTEXT) LOGI("contexto OpenGL ES %d.%d criado", vers[i][0], vers[i][1]);
              }
              if (g_ctx == EGL_NO_CONTEXT) {
                  const EGLint a[] = {EGL_CONTEXT_CLIENT_VERSION, 3, EGL_NONE};
                  g_ctx = eglCreateContext(g_dpy, cfg, EGL_NO_CONTEXT, a);
              }
              if (g_ctx == EGL_NO_CONTEXT) { LOGE("eglCreateContext falhou"); return false; }
              return eglMakeCurrent(g_dpy, g_surf, g_surf, g_ctx);
          }
          void eglShutdown() {
              if (g_dpy != EGL_NO_DISPLAY) {
                  eglMakeCurrent(g_dpy, EGL_NO_SURFACE, EGL_NO_SURFACE, EGL_NO_CONTEXT);
                  if (g_ctx != EGL_NO_CONTEXT) eglDestroyContext(g_dpy, g_ctx);
                  if (g_surf != EGL_NO_SURFACE) eglDestroySurface(g_dpy, g_surf);
                  eglTerminate(g_dpy);
              }
              g_dpy = EGL_NO_DISPLAY; g_surf = EGL_NO_SURFACE; g_ctx = EGL_NO_CONTEXT;
          }

          // ---------- save RAM (.srm), como o RetroArch ----------
          std::string srmPath() {
              return g_saveDir + "/" + (g_saveName.empty() ? std::string("game") : g_saveName) + ".srm";
          }

          void sramLoad() {
              g_lastSram.clear();
              if (!p_get_memory_size || !p_get_memory_data) return;
              size_t size = p_get_memory_size(RETRO_MEMORY_SAVE_RAM);
              uint8_t* data = (uint8_t*)p_get_memory_data(RETRO_MEMORY_SAVE_RAM);
              if (!size || !data) { LOGI("este jogo nao tem save RAM"); return; }
              FILE* f = fopen(srmPath().c_str(), "rb");
              if (f) {
                  size_t got = fread(data, 1, size, f);
                  fclose(f);
                  LOGI("save RAM carregada: %zu de %zu bytes", got, size);
              }
              g_lastSram.assign(data, data + size);
          }

          void sramSave() {
              if (!p_get_memory_size || !p_get_memory_data) return;
              size_t size = p_get_memory_size(RETRO_MEMORY_SAVE_RAM);
              const uint8_t* data = (const uint8_t*)p_get_memory_data(RETRO_MEMORY_SAVE_RAM);
              if (!size || !data) return;
              if (g_lastSram.size() == size && memcmp(g_lastSram.data(), data, size) == 0) return;
              std::string tmp = srmPath() + ".tmp";
              FILE* f = fopen(tmp.c_str(), "wb");
              if (!f) { LOGE("nao consegui gravar a save RAM"); return; }
              size_t w = fwrite(data, 1, size, f);
              fclose(f);
              if (w == size && rename(tmp.c_str(), srmPath().c_str()) == 0) {
                  g_lastSram.assign(data, data + size);
                  LOGI("save RAM gravada (%zu bytes)", size);
              }
          }

          // ---------- save states (slots) ----------
          // retro_serialize/unserialize precisam rodar na thread do emulador, entre dois retro_run.
          // Quem pede (thread da UI/JNI) deixa o pedido em g_stateReq e a thread do emulador o atende.
          std::atomic<int> g_stateReq{0};   // 0 = nada, 1 = salvar, 2 = carregar
          std::atomic<int> g_stateSlot{0};
          std::atomic<int> g_stateRes{0};   // 1 = ok, -1 = falhou
          std::mutex g_stateCallMutex;

          std::string statePath(int slot) {
              return g_saveDir + "/" + (g_saveName.empty() ? std::string("game") : g_saveName) +
                     ".state" + std::to_string(slot);
          }

          void handleStateRequest() {
              int req = g_stateReq.load();
              if (!req) return;
              bool ok = false;
              std::string path = statePath(g_stateSlot.load());
              if (p_serialize_size && p_serialize && p_unserialize) {
                  if (req == 1) {
                      size_t size = p_serialize_size();
                      if (size > 0) {
                          std::vector<uint8_t> buf(size);
                          if (p_serialize(buf.data(), size)) {
                              std::string tmp = path + ".tmp";
                              FILE* f = fopen(tmp.c_str(), "wb");
                              if (f) {
                                  size_t w = fwrite(buf.data(), 1, size, f);
                                  bool closed = fclose(f) == 0;
                                  if (w == size && closed && rename(tmp.c_str(), path.c_str()) == 0) ok = true;
                                  else remove(tmp.c_str());
                              }
                          } else {
                              LOGE("retro_serialize falhou");
                          }
                      }
                  } else if (req == 2) {
                      FILE* f = fopen(path.c_str(), "rb");
                      if (f) {
                          fseek(f, 0, SEEK_END);
                          long sz = ftell(f);
                          fseek(f, 0, SEEK_SET);
                          if (sz > 0) {
                              std::vector<uint8_t> buf((size_t)sz);
                              if (fread(buf.data(), 1, buf.size(), f) == buf.size()) {
                                  ok = p_unserialize(buf.data(), buf.size());
                                  if (!ok) LOGE("retro_unserialize recusou o estado");
                              }
                          }
                          fclose(f);
                      }
                  }
              } else {
                  LOGE("este nucleo nao suporta save states");
              }
              LOGI("save state %s slot %d: %s", req == 1 ? "salvar" : "carregar", g_stateSlot.load(), ok ? "ok" : "falhou");
              g_stateRes = ok ? 1 : -1;
              g_stateReq = 0;
          }

          bool requestState(int req, int slot) {
              if (!g_running || !g_threadValid || !p_serialize_size) return false;
              std::lock_guard<std::mutex> once(g_stateCallMutex);
              g_stateRes = 0;
              g_stateSlot = slot;
              { std::lock_guard<std::mutex> l(g_pauseMutex); g_stateReq = req; }
              g_pauseCv.notify_all();
              for (int i = 0; i < 200 && g_stateReq.load() != 0 && g_running; i++) usleep(50000);
              if (g_stateReq.load() != 0) {
                  int exp = req;
                  if (g_stateReq.compare_exchange_strong(exp, 0)) return false;  // ninguem atendeu: cancela
                  while (g_stateReq.load() != 0) usleep(1000);                   // ja esta sendo atendido
              }
              return g_stateRes.load() == 1;
          }

          // ---------- jogo ----------
          void runGame(const std::string& romPath, bool& coreLoaded, bool& gameLoaded) {
              g_firstFrame = true;
              g_psPadType = RETRO_DEVICE_ANALOG;
              g_isPs1 = false;
              g_swFrame = false;
              g_sramFrames = 0;
              g_pixelFormat = RETRO_PIXEL_FORMAT_XRGB8888;
              g_uploadRgba.clear();
              g_frameW = g_frameH = 0;
              g_sFbo = g_sRbo = 0;
              g_sCounter = 0;
              { std::lock_guard<std::mutex> l(g_sMutex); g_sNew = false; }
              if (!eglInit()) { setStatus("ERRO: falha ao criar o contexto gráfico (OpenGL ES 3)."); return; }
              eglSwapInterval(g_dpy, 0);
              LOGI("GL_VERSION=%s", (const char*)glGetString(GL_VERSION));
              LOGI("GL_RENDERER=%s", (const char*)glGetString(GL_RENDERER));

              if (!loadCore()) { setStatus("ERRO: não consegui carregar o núcleo (" + g_libPath + "): " + g_loadErr); return; }
              coreLoaded = true;

              p_set_environment(envCb);
              p_set_video_refresh(videoCb);
              p_set_audio_sample(audioSampleCb);
              p_set_audio_batch(audioBatchCb);
              p_set_input_poll(pollCb);
              p_set_input_state(stateCb);
              p_init();

              retro_system_info si{};
              p_get_system_info(&si);
              LOGI("nucleo: %s %s need_fullpath=%d", si.library_name ? si.library_name : "?",
                   si.library_version ? si.library_version : "?", (int)si.need_fullpath);

              retro_game_info gi{};
              std::vector<uint8_t> buf;
              gi.path = romPath.c_str();
              if (!si.need_fullpath) {
                  FILE* f = fopen(romPath.c_str(), "rb");
                  if (!f) { setStatus("ERRO: não consegui ler a ROM."); return; }
                  fseek(f, 0, SEEK_END);
                  long sz = ftell(f);
                  fseek(f, 0, SEEK_SET);
                  buf.resize(sz > 0 ? (size_t)sz : 0);
                  size_t got = fread(buf.data(), 1, buf.size(), f);
                  fclose(f);
                  if (got != buf.size()) { setStatus("ERRO: leitura incompleta da ROM."); return; }
                  gi.data = buf.data();
                  gi.size = buf.size();
              }
              LOGI("carregando ROM (%zu bytes)", buf.size());
              if (!p_load_game(&gi)) { setStatus("ERRO: o núcleo recusou a ROM (formato inválido ou não suportado)."); return; }
              gameLoaded = true;
              g_isPs1 = si.library_name && (strstr(si.library_name, "PCSX") || strstr(si.library_name, "PSX") || strstr(si.library_name, "Swan"));
              LOGI("sistema: %s", g_isPs1 ? "PlayStation" : "Nintendo 64");
              sramLoad();
              // 4 controles N64 (o dono da sala na porta 0; convidados nas portas 1..3)
              if (p_set_port_device) {
                  unsigned nports = MAX_PLAYERS;
                  if (g_isPs1) {
                      // PS1: 2 controles por padrao; a sala (host) pede 4 pelo multitap
                      nports = 2;
                      std::lock_guard<std::mutex> l(g_optMutex);
                      auto it = g_options.find("muntdroid_ports");
                      if (it != g_options.end()) nports = (unsigned)atoi(it->second.c_str());
                      if (nports < 2) nports = 2;
                      if (nports > (unsigned)MAX_PLAYERS) nports = MAX_PLAYERS;
                  }
                  LOGI("tipo de controle nas portas: 0x%x", g_isPs1 ? g_psPadType : (unsigned)RETRO_DEVICE_JOYPAD);
                  for (unsigned i = 0; i < nports; i++) p_set_port_device(i, g_isPs1 ? g_psPadType : RETRO_DEVICE_JOYPAD);
              }

              retro_system_av_info av{};
              p_get_av_info(&av);
              updateAspect(av.geometry);
              if (av.timing.sample_rate > 0) g_sampleRate = (int)av.timing.sample_rate;
              LOGI("av: base %ux%u max %ux%u aspect=%.3f fps=%.2f rate=%.0f", av.geometry.base_width, av.geometry.base_height,
                   av.geometry.max_width, av.geometry.max_height, g_aspect, av.timing.fps, av.timing.sample_rate);
              unsigned mw = av.geometry.max_width > 640 ? av.geometry.max_width : 640;
              unsigned mh = av.geometry.max_height > 480 ? av.geometry.max_height : 480;
              createFbo(mw, mh);
              audioOpen(g_sampleRate);
              if (g_hw.context_reset) g_hw.context_reset();
              else { g_swFrame = true; LOGI("nucleo em modo software (sem HW render)"); }
              setStatus("OK");
              LOGI("rodando");

              g_stateReq = 0;
              while (g_running) {
                  handleStateRequest();
                  if (g_paused) {
                      std::unique_lock<std::mutex> l(g_pauseMutex);
                      g_pauseCv.wait(l, [] { return !g_paused || !g_running || g_stateReq.load() != 0; });
                      continue;
                  }
                  p_run();
                  if (++g_sramFrames >= 600) { g_sramFrames = 0; sramSave(); }
              }
          }

          void emuThread(std::string romPath) {
              bool coreLoaded = false, gameLoaded = false;
              runGame(romPath, coreLoaded, gameLoaded);
              if (gameLoaded) {
                  sramSave();
                  if (g_hw.context_destroy) g_hw.context_destroy();
                  p_unload_game();
              }
              if (coreLoaded) { p_deinit(); dlclose(g_lib); g_lib = nullptr; }
              if (g_fbo) destroyFbo();
              destroyStream();
              audioClose();
              eglShutdown();
              g_hw = retro_hw_render_callback{};
              g_running = false;
              LOGI("thread encerrada");
          }

          void* emuThreadEntry(void* arg) {
              std::string* p = (std::string*)arg;
              std::string rom = *p;
              delete p;
              emuThread(rom);
              return nullptr;
          }

          // Thread do emulador com pilha grande (a thread principal do RetroArch tem 8 MB; o std::thread
          // padrao do Android tem so 1 MB, pouco para a inicializacao do nucleo N64).
          bool startEmuThread(const std::string& rom) {
              pthread_attr_t attr;
              pthread_attr_init(&attr);
              pthread_attr_setstacksize(&attr, 16 * 1024 * 1024);
              std::string* p = new std::string(rom);
              int rc = pthread_create(&g_thread, &attr, emuThreadEntry, p);
              pthread_attr_destroy(&attr);
              if (rc != 0) { delete p; return false; }
              g_threadValid = true;
              return true;
          }

          void joinEmuThread() {
              if (g_threadValid) { pthread_join(g_thread, nullptr); g_threadValid = false; }
          }

          std::string jstr(JNIEnv* env, jstring s) {
              const char* c = env->GetStringUTFChars(s, nullptr);
              std::string r = c ? c : "";
              if (c) env->ReleaseStringUTFChars(s, c);
              return r;
          }

          }  // namespace

          extern "C" {

          JNIEXPORT void JNICALL Java_dev_n64emu_app_NativeBridge_init(JNIEnv* env, jobject, jstring libPath, jstring sysDir, jstring saveDir, jstring logPath, jstring saveName) {
              g_libPath = jstr(env, libPath);
              g_systemDir = jstr(env, sysDir);
              g_saveDir = jstr(env, saveDir);
              g_saveName = jstr(env, saveName);
              std::string lp = jstr(env, logPath);
              std::lock_guard<std::mutex> l(g_logMutex);
              if (g_logf) { fclose(g_logf); g_logf = nullptr; }
              if (!lp.empty()) g_logf = fopen(lp.c_str(), "w");
          }
          JNIEXPORT void JNICALL Java_dev_n64emu_app_NativeBridge_setOption(JNIEnv* env, jobject, jstring k, jstring v) {
              std::lock_guard<std::mutex> l(g_optMutex);
              g_options[jstr(env, k)] = jstr(env, v);
              g_optionsDirty = true;
          }
          JNIEXPORT jstring JNICALL Java_dev_n64emu_app_NativeBridge_getStatus(JNIEnv* env, jobject) {
              std::lock_guard<std::mutex> l(g_statusMutex);
              return env->NewStringUTF(g_status.c_str());
          }
          JNIEXPORT void JNICALL Java_dev_n64emu_app_NativeBridge_start(JNIEnv* env, jobject, jstring rom, jobject surface) {
              if (g_threadValid) {
                  g_running = false; g_paused = false; g_pauseCv.notify_all();
                  joinEmuThread();
                  if (g_window) { ANativeWindow_release(g_window); g_window = nullptr; }
              }
              setStatus("");
              for (int p = 0; p < MAX_PLAYERS; p++) {
                  g_padBtn[p] = 0;
                  for (int a = 0; a < 4; a++) g_padAx[p][a] = 0;
              }
              g_window = ANativeWindow_fromSurface(env, surface);
              g_running = true;
              g_paused = false;
              if (!startEmuThread(jstr(env, rom))) { g_running = false; setStatus("ERRO: não consegui criar a thread do emulador."); }
          }
          JNIEXPORT jboolean JNICALL Java_dev_n64emu_app_NativeBridge_saveState(JNIEnv*, jobject, jint slot) {
              return requestState(1, slot) ? JNI_TRUE : JNI_FALSE;
          }
          JNIEXPORT jboolean JNICALL Java_dev_n64emu_app_NativeBridge_loadState(JNIEnv*, jobject, jint slot) {
              return requestState(2, slot) ? JNI_TRUE : JNI_FALSE;
          }
          JNIEXPORT void JNICALL Java_dev_n64emu_app_NativeBridge_pause(JNIEnv*, jobject) { g_paused = true; }
          JNIEXPORT void JNICALL Java_dev_n64emu_app_NativeBridge_resume(JNIEnv*, jobject) {
              g_paused = false; g_pauseCv.notify_all();
          }
          JNIEXPORT void JNICALL Java_dev_n64emu_app_NativeBridge_stop(JNIEnv*, jobject) {
              g_running = false; g_paused = false; g_pauseCv.notify_all();
              joinEmuThread();
              if (g_window) { ANativeWindow_release(g_window); g_window = nullptr; }
          }
          JNIEXPORT void JNICALL Java_dev_n64emu_app_NativeBridge_setButton(JNIEnv*, jobject, jint id, jboolean pressed) {
              if (id < 0 || id > 15) return;
              int cur = g_padBtn[0].load();
              g_padBtn[0] = pressed ? (cur | (1 << id)) : (cur & ~(1 << id));
          }
          JNIEXPORT void JNICALL Java_dev_n64emu_app_NativeBridge_setAnalog(JNIEnv*, jobject, jint which, jfloat x, jfloat y) {
              int base = which == 1 ? 2 : 0;
              if (x > 1.f) x = 1.f; if (x < -1.f) x = -1.f;
              if (y > 1.f) y = 1.f; if (y < -1.f) y = -1.f;
              g_padAx[0][base] = (int)(x * 32767.f);
              g_padAx[0][base + 1] = (int)(y * 32767.f);
          }

          // controle remoto (convidado da sala) nas portas 1..3
          JNIEXPORT void JNICALL Java_dev_n64emu_app_NativeBridge_setPad(JNIEnv*, jobject, jint port, jint buttons, jint lx, jint ly, jint rx, jint ry) {
              if (port < 0 || port >= MAX_PLAYERS) return;
              g_padBtn[port] = buttons & 0xFFFF;
              g_padAx[port][0] = clamp16(lx);
              g_padAx[port][1] = clamp16(ly);
              g_padAx[port][2] = clamp16(rx);
              g_padAx[port][3] = clamp16(ry);
          }

          // vídeo para os convidados
          JNIEXPORT void JNICALL Java_dev_n64emu_app_NativeBridge_setStreaming(JNIEnv*, jobject, jboolean on) { g_stream = on; }
          JNIEXPORT jint JNICALL Java_dev_n64emu_app_NativeBridge_getStreamSize(JNIEnv*, jobject) {
              return (jint)((STREAM_W << 16) | STREAM_H);
          }
          JNIEXPORT jfloat JNICALL Java_dev_n64emu_app_NativeBridge_getFrameAspect(JNIEnv*, jobject) {
              std::lock_guard<std::mutex> l(g_sMutex);
              return g_sAspect;
          }
          JNIEXPORT jbyteArray JNICALL Java_dev_n64emu_app_NativeBridge_grabFrame(JNIEnv* env, jobject) {
              std::lock_guard<std::mutex> l(g_sMutex);
              if (!g_sNew || g_sLatest.empty()) return nullptr;
              g_sNew = false;
              jbyteArray arr = env->NewByteArray((jsize)g_sLatest.size());
              if (!arr) return nullptr;
              env->SetByteArrayRegion(arr, 0, (jsize)g_sLatest.size(), (const jbyte*)g_sLatest.data());
              return arr;
          }

          }
